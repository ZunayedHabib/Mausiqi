<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mausiqi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#12131F; }
  a { color:#C9A227; text-decoration:none; }
  ::selection { background:rgba(201,162,39,.3); }
  *:focus-visible { outline:2px solid #C9A227; outline-offset:2px; }
  button { font-family:inherit; }

  @keyframes g-spin { to { transform: rotate(360deg); } }
  @keyframes g-ring { 0% { transform:scale(.9); opacity:.5; } 100% { transform:scale(1.5); opacity:0; } }
  @keyframes g-mote { 0% { transform: translate3d(0,30px,0) scale(.5); opacity:0; } 20% { opacity:.9; } 80% { opacity:.4; } 100% { transform: translate3d(30px,-320px,0) scale(1.1); opacity:0; } }
  @keyframes g-eq { 0%,100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }
  @keyframes g-in { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform:none; } }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
  }

  #g-root{ position:relative; width:100vw; height:100vh; overflow:hidden; background:#12131F; color:#F5E6C8; font-family:'Work Sans',sans-serif; perspective:1000px; perspective-origin:50% 46%; }

  .g-bg{ position:absolute; inset:-10%; background:radial-gradient(100% 90% at 50% 54%, rgba(139,38,53,.28) 0%, rgba(18,19,31,0) 62%), linear-gradient(180deg, #0E0F19, #12131F 50%, #191423); pointer-events:none; }
  .g-grain{ position:absolute; inset:-8%; opacity:.28; pointer-events:none; background-image:radial-gradient(rgba(245,230,200,.32) 1px, transparent 1.3px); background-size:30px 30px; mask-image:radial-gradient(72% 66% at 50% 46%, #000, transparent 76%); -webkit-mask-image:radial-gradient(72% 66% at 50% 46%, #000, transparent 76%); }
  .g-grooves{ position:absolute; left:50%; top:50%; width:min(150vh,150vw); height:min(150vh,150vw); margin:calc(min(150vh,150vw) / -2) 0 0 calc(min(150vh,150vw) / -2); pointer-events:none; opacity:.34; border-radius:50%; background:repeating-radial-gradient(circle at 50% 50%, rgba(245,230,200,.11) 0 1px, rgba(0,0,0,0) 1px 13px); }

  .g-disc-wrap{ position:absolute; left:50%; top:50%; width:min(72vh,60vw); height:min(72vh,60vw); margin:calc(min(72vh,60vw) / -2) 0 0 calc(min(72vh,60vw) / -2); pointer-events:none; }
  .g-disc-glow{ position:absolute; inset:-18%; border-radius:50%; background:radial-gradient(closest-side, rgba(201,162,39,.2), rgba(18,19,31,0) 72%); filter:blur(8px); }
  .g-disc{ position:absolute; inset:0; border-radius:50%; overflow:hidden; box-shadow:0 40px 80px rgba(0,0,0,.66), inset 0 0 0 1px rgba(245,230,200,.08);
    animation:g-spin 4.2s linear infinite; animation-play-state:paused;
    background: repeating-radial-gradient(circle at 50% 50%, rgba(245,230,200,.05) 0 1px, rgba(0,0,0,0) 1px 5px), repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.6) 0 2px, rgba(255,255,255,.02) 2px 6px), radial-gradient(circle at 50% 50%, #221e29 0 24%, #14131c 24% 76%, #201b25 76% 100%); }
  body.is-playing .g-disc{ animation-play-state:running; }
  .g-disc-sheen{ position:absolute; inset:0; border-radius:50%; mix-blend-mode:screen; opacity:.62; background:conic-gradient(from 0deg, rgba(245,230,200,.14), rgba(245,230,200,0) 24%, rgba(201,162,39,.22) 44%, rgba(245,230,200,0) 64%, rgba(139,38,53,.26) 84%, rgba(245,230,200,.12) 100%); }
  .g-label{ position:absolute; left:50%; top:50%; width:30%; height:30%; margin:-15% 0 0 -15%; border-radius:50%; background:radial-gradient(circle at 40% 34%, #A32E3F, #8B2635 62%, #6D1D29); box-shadow:0 0 0 1px rgba(201,162,39,.45); display:flex; align-items:center; justify-content:center; }
  .g-label-title{ position:absolute; left:0; right:0; top:50%; transform:translateY(-176%); text-align:center; font-family:'Amiri',serif; font-size:17px; line-height:1.3; letter-spacing:.03em; color:#F5E6C8; }
  .g-label-sub{ position:absolute; left:0; right:0; top:50%; transform:translateY(86%); text-align:center; font-family:'Amiri',serif; font-size:13px; line-height:1.4; color:#C9A227; }
  .g-spindle{ position:absolute; left:50%; top:50%; width:2.6%; height:2.6%; margin:-1.3% 0 0 -1.3%; border-radius:50%; background:#12131F; }
  .g-ring{ position:absolute; inset:0; border-radius:50%; border:1px solid rgba(201,162,39,.4); animation:g-ring 5s ease-out infinite; animation-play-state:paused; }
  .g-ring2{ position:absolute; inset:0; border-radius:50%; border:1px solid rgba(139,38,53,.5); animation:g-ring 5s ease-out infinite; animation-delay:2.5s; animation-play-state:paused; }
  body.is-playing .g-ring, body.is-playing .g-ring2{ animation-play-state:running; }

  .g-motes span{ position:absolute; border-radius:50%; animation:g-mote linear infinite; }

  .g-content{ position:absolute; inset:0; z-index:6; display:grid; grid-template-columns:auto 1fr 372px; grid-template-rows:auto 1fr auto; gap:0 42px; padding:40px 52px 34px; }

  .g-header{ grid-column:1 / 3; animation:g-in .85s ease-out both; }
  .g-title{ font-family:'Amiri',serif; font-weight:700; font-size:52px; line-height:1.1; text-shadow:0 4px 26px rgba(18,19,31,.9); }
  .g-tagline{ margin:12px 0 0; font-family:'Amiri',serif; font-style:italic; font-size:19px; color:rgba(245,230,200,.7); text-shadow:0 2px 18px rgba(18,19,31,.9); }

  .g-nav{ grid-row:2; grid-column:1; display:flex; flex-direction:column; justify-content:center; gap:8px; animation:g-in 1.05s ease-out both; max-height:70vh; overflow-y:auto; scrollbar-width:none; }
  .g-nav::-webkit-scrollbar{ display:none; }
  .g-nav-item{ display:flex; align-items:center; gap:11px; padding:9px 0; border:none; background:transparent; color:rgba(245,230,200,.5); font-family:'Work Sans',sans-serif; font-size:11px; letter-spacing:.2em; text-transform:uppercase; text-align:left; cursor:pointer; transition:color .2s; white-space:nowrap; }
  .g-nav-item:hover{ color:#F5E6C8; }
  .g-nav-item.active{ color:#F5E6C8; }
  .g-nav-dash{ width:16px; height:1px; background:rgba(245,230,200,.28); transition:width .25s, background .25s; flex-shrink:0; }
  .g-nav-item.active .g-nav-dash{ width:38px; background:#C9A227; }
  .g-nav-remove{ margin-left:auto; opacity:0; background:none; border:none; color:rgba(245,230,200,.4); font-size:11px; cursor:pointer; padding:0 4px; }
  .g-nav-item:hover .g-nav-remove{ opacity:1; }
  .g-nav-remove:hover{ color:#C9A227; }
  .g-nav-add{ display:flex; align-items:center; gap:11px; margin-top:6px; padding:9px 0; border:none; background:transparent; color:rgba(245,230,200,.42); font-family:'Work Sans',sans-serif; font-size:11px; letter-spacing:.2em; text-transform:uppercase; cursor:pointer; transition:color .2s; }
  .g-nav-add:hover{ color:#C9A227; }

  .g-add-form{ display:none; flex-direction:column; gap:6px; margin-top:8px; }
  .g-add-form.open{ display:flex; }
  .g-add-form input{ background:rgba(10,10,17,.6); border:1px solid rgba(245,230,200,.18); border-radius:3px; padding:7px 9px; color:#F5E6C8; font-family:'Work Sans',sans-serif; font-size:11px; outline:none; width:190px; }
  .g-add-form input:focus{ border-color:#C9A227; }
  .g-add-form input::placeholder{ color:rgba(245,230,200,.35); }
  .g-add-form-row{ display:flex; gap:6px; }
  .g-add-form button{ background:#C9A227; color:#12131F; border:none; border-radius:3px; padding:0 12px; font-size:11px; font-weight:600; cursor:pointer; letter-spacing:.05em; }
  .g-add-form button:hover{ background:#E4C24A; }
  .g-add-status{ font-size:10px; color:rgba(245,230,200,.45); margin-top:2px; max-width:190px; }
  .g-add-status.error{ color:#E08A8A; }

  .g-panel{ grid-row:1 / 3; grid-column:3; display:flex; flex-direction:column; min-height:0; justify-content:center; animation:g-in 1.2s ease-out both; }
  .g-panel-head{ display:flex; align-items:baseline; justify-content:space-between; padding:0 4px 14px; }
  .g-panel-name{ font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:#C9A227; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
  .g-panel-count{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(245,230,200,.4); white-space:nowrap; }
  .g-tracklist{ display:flex; flex-direction:column; gap:1px; overflow-y:auto; padding:8px; background:rgba(10,10,17,.5); backdrop-filter:blur(9px); border-radius:2px; max-height:56vh; scrollbar-width:thin; scrollbar-color:#C9A227 rgba(245,230,200,.06);
    opacity:1; transition:opacity .25s ease; }
  .g-tracklist.collapsed{ display:none; opacity:0; }

  .g-stack{ width:100%; border:none; background:transparent; cursor:pointer; padding:10px 0 4px; display:flex; flex-direction:column; align-items:center; gap:8px; transition:opacity .2s ease, transform .2s ease; }
  .g-stack:hover{ opacity:.85; }
  .g-stack:hover ellipse:last-of-type{ filter:brightness(1.15); }
  .g-stack.hidden{ display:none; }
  .g-stack-hint{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:rgba(245,230,200,.42); }
  #stackChevron{ transition: transform .25s ease; transform-origin:130px 130px; }
  .g-stack.open #stackChevron{ transform: rotate(180deg); }
  .g-tracklist::-webkit-scrollbar{ width:7px; }
  .g-tracklist::-webkit-scrollbar-track{ background:rgba(245,230,200,.06); border-radius:4px; }
  .g-tracklist::-webkit-scrollbar-thumb{ background:linear-gradient(180deg, #C9A227, #8B2635); border-radius:4px; border:1px solid rgba(18,19,31,.4); }
  .g-tracklist::-webkit-scrollbar-thumb:hover{ background:linear-gradient(180deg, #E4C24A, #A32E3F); }

  .g-nav::-webkit-scrollbar{ width:5px; }
  .g-nav::-webkit-scrollbar-track{ background:transparent; }
  .g-nav::-webkit-scrollbar-thumb{ background:rgba(201,162,39,.4); border-radius:3px; }
  .g-nav{ scrollbar-color:rgba(201,162,39,.4) transparent; }
  .g-track{ display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:12px; padding:7px 10px; border:none; border-left:2px solid transparent; border-radius:1px; background:transparent; color:rgba(245,230,200,.76); font-family:'Work Sans',sans-serif; text-align:left; cursor:pointer; transition:background .2s, border-color .2s, color .2s; width:100%; }
  .g-track:hover{ background:rgba(245,230,200,.08); color:#F5E6C8; }
  .g-track.active{ background:rgba(139,38,53,.3); border-left-color:#C9A227; color:#F5E6C8; }
  .g-track-title{ font-family:'Amiri',serif; font-size:17px; line-height:1.6; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .g-track-artist{ font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:rgba(245,230,200,.4); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
  .g-track-eq{ display:flex; align-items:flex-end; gap:2px; height:11px; opacity:0; }
  .g-track.active .g-track-eq{ opacity:1; }
  .g-track-eq i{ display:block; width:2px; height:11px; background:#C9A227; transform-origin:bottom; animation:g-eq .9s ease-in-out infinite; animation-play-state:paused; }
  .g-track-eq i:nth-child(2){ animation-duration:.7s; animation-delay:.16s; }
  .g-track-eq i:nth-child(3){ animation-duration:1.1s; animation-delay:.32s; }
  body.is-playing .g-track-eq i{ animation-play-state:running; }
  .g-track-len{ font-size:11px; color:rgba(245,230,200,.38); font-variant-numeric:tabular-nums; }
  .g-empty{ padding:20px 10px; text-align:center; font-family:'Amiri',serif; font-style:italic; font-size:13px; color:rgba(245,230,200,.4); }

  .g-transport{ grid-row:3; grid-column:1 / -1; display:flex; align-items:center; gap:30px; padding-top:26px; animation:g-in 1.35s ease-out both; }
  .g-controls{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .g-btn-round{ position:relative; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(201,162,39,.35);
    background: radial-gradient(circle at 34% 30%, #2c2418, #16130f 78%);
    color:rgba(245,230,200,.85); font-size:13px; cursor:pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.55), inset 0 1px 0 rgba(245,230,200,.12), inset 0 -3px 5px rgba(0,0,0,.6);
    transition: box-shadow .2s, border-color .2s, transform .12s; }
  .g-btn-round:hover{ border-color:#C9A227; box-shadow:0 3px 10px rgba(0,0,0,.6), 0 0 14px rgba(201,162,39,.35), inset 0 1px 0 rgba(245,230,200,.18), inset 0 -3px 5px rgba(0,0,0,.6); }
  .g-btn-round:active{ transform: scale(.93); }
  .g-btn-round.on{ border-color:#F0DFA0; color:#211a0d;
    background: radial-gradient(circle at 34% 30%, #F0DFA0, #C9A227 55%, #8f6f1a 100%);
    box-shadow: 0 3px 8px rgba(0,0,0,.5), 0 0 16px rgba(201,162,39,.5), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 4px rgba(70,50,10,.5); }
  .g-repeat-badge{ display:none; position:absolute; bottom:-3px; right:-3px; width:14px; height:14px; border-radius:50%; background:#8B2635; color:#F5E6C8; font-size:9px; font-weight:600; line-height:14px; text-align:center; border:1px solid rgba(18,19,31,.6); }
  .g-repeat-badge.visible{ display:block; }
  .g-btn-play{ width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
    border:2px solid #3a2f1a;
    background: radial-gradient(circle at 35% 28%, #F0DFA0, #C9A227 55%, #8f6f1a 100%);
    color:#211a0d; font-size:16px;
    box-shadow: 0 8px 18px rgba(0,0,0,.5), 0 0 0 3px rgba(201,162,39,.15), inset 0 2px 2px rgba(255,255,255,.5), inset 0 -3px 6px rgba(70,50,10,.5);
    transition: transform .18s, box-shadow .2s; }
  .g-btn-play:hover{ transform:translateY(-2px); box-shadow: 0 10px 22px rgba(0,0,0,.55), 0 0 0 3px rgba(201,162,39,.25), inset 0 2px 2px rgba(255,255,255,.55), inset 0 -3px 6px rgba(70,50,10,.5); }
  .g-btn-play:active{ transform:translateY(0) scale(.95); }

  .g-nowplaying{ display:flex; flex-direction:column; gap:5px; min-width:0; width:250px; flex-shrink:0; }
  .g-nowplaying-label{ font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:#C9A227; }
  .g-nowplaying-title{ font-family:'Amiri',serif; font-size:20px; line-height:1.5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .g-progress-wrap{ flex:1 1 auto; display:flex; align-items:center; gap:16px; min-width:0; }
  .g-needle{ flex:1 1 auto; width:100%; height:22px; cursor:pointer; overflow:visible; }
  #progressBead{ transition: cx 0.15s linear; }
  .g-elapsed{ font-size:11px; color:rgba(245,230,200,.44); font-variant-numeric:tabular-nums; white-space:nowrap; }

  .g-volume{ display:flex; align-items:center; gap:9px; flex-shrink:0; }
  .g-volume-label{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(245,230,200,.4); }
  .g-volume-bars{ display:flex; align-items:flex-end; gap:3px; height:18px; }
  .g-volume-bars button{ width:5px; padding:0; border:none; border-radius:1px; background:rgba(245,230,200,.2); cursor:pointer; }
  .g-volume-bars button.on{ background:#C9A227; }

  #ytPlayerHidden{ position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; }

  @media (max-width: 900px){
    .g-content{ grid-template-columns:1fr; grid-template-rows:auto auto 1fr auto; padding:22px 22px 18px; gap:14px; }
    .g-header{ grid-column:1; }
    .g-nav{ grid-row:2; grid-column:1; flex-direction:row; flex-wrap:wrap; max-height:none; }
    .g-panel{ grid-row:3; grid-column:1; }
    .g-transport{ grid-row:4; grid-column:1; flex-wrap:wrap; gap:14px; }
    .g-title{ font-size:34px; }
    .g-tagline{ font-size:14px; }
    .g-disc-wrap{ width:min(50vh,70vw); height:min(50vh,70vw); }
  }
</style>
</head>
<body>

<div id="g-root">
  <div class="g-bg" data-depth="0.08"></div>
  <div class="g-grain" data-depth="0.2"></div>
  <div class="g-grooves" data-depth="0.34"></div>

  <div class="g-disc-wrap" data-depth="0.5">
    <div class="g-disc-glow"></div>
    <div class="g-disc" id="gDisc">
      <div class="g-disc-sheen"></div>
      <div class="g-label">
        <span class="g-label-title">Mausiqi</span>
        <span class="g-label-sub">موسیقی</span>
      </div>
      <div class="g-spindle"></div>
    </div>
    <div class="g-ring"></div>
    <div class="g-ring2"></div>
  </div>

  <div class="g-motes" data-depth="0.78">
    <span style="left:22%; bottom:4%; width:4px; height:4px; background:#C9A227; box-shadow:0 0 12px rgba(201,162,39,.95); animation-duration:15s;"></span>
    <span style="left:48%; bottom:0; width:3px; height:3px; background:#F5E6C8; box-shadow:0 0 10px rgba(245,230,200,.8); animation-duration:19s; animation-delay:3.4s;"></span>
    <span style="left:69%; bottom:7%; width:4px; height:4px; background:#8B2635; box-shadow:0 0 12px rgba(139,38,53,1); animation-duration:17s; animation-delay:6.8s;"></span>
    <span style="left:86%; bottom:2%; width:3px; height:3px; background:#C9A227; box-shadow:0 0 10px rgba(201,162,39,.85); animation-duration:22s; animation-delay:1.6s;"></span>
  </div>

  <div class="g-content">
    <div class="g-header">
      <span class="g-title">Mausiqi</span>
      <p class="g-tagline">&ldquo;Music expresses that which cannot be put into words.&rdquo;</p>
    </div>

    <div class="g-nav" id="gNav">
      <!-- playlist nav items injected here -->
      <button type="button" class="g-nav-add" id="addPlaylistToggle">
        <span class="g-nav-dash" style="width:14px;"></span>Add playlist
      </button>
      <div class="g-add-form" id="addPlaylistForm">
        <input type="text" id="playlistNameInput" placeholder="Label (optional)">
        <div class="g-add-form-row">
          <input type="text" id="playlistLinkInput" placeholder="Playlist link or ID">
          <button type="button" id="addPlaylistBtn">Add</button>
        </div>
        <div class="g-add-status" id="addStatus"></div>
      </div>
    </div>

    <div class="g-panel">
      <div class="g-panel-head" id="panelToggle">
        <span class="g-panel-name" id="panelName">No playlist yet</span>
        <span class="g-panel-count" id="panelCount"></span>
      </div>
      <button type="button" class="g-stack" id="recordStack" aria-label="Show track list">
        <svg viewBox="0 0 260 160" width="100%" height="140">
          <defs>
            <linearGradient id="stackEdge" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3a3648"/>
              <stop offset="100%" stop-color="#141420"/>
            </linearGradient>
          </defs>
          <g transform="translate(130,58)">
            <ellipse cx="0" cy="36" rx="70" ry="18" fill="url(#stackEdge)"/>
            <ellipse cx="0" cy="24" rx="70" ry="18" fill="url(#stackEdge)"/>
            <ellipse cx="0" cy="12" rx="70" ry="18" fill="url(#stackEdge)"/>
            <ellipse cx="0" cy="0" rx="70" ry="18" fill="#1c1b26" stroke="#3a3648" stroke-width="1"/>
            <ellipse cx="0" cy="0" rx="22" ry="6" fill="#8B2635"/>
            <circle cx="0" cy="0" r="2.5" fill="#12131F"/>
          </g>
          <path id="stackChevron" d="M118,128 L130,138 L142,128" fill="none" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="g-stack-hint">Tap to browse tracks</span>
      </button>
      <div class="g-tracklist collapsed" id="trackList">
        <div class="g-empty">Add a playlist to begin.</div>
      </div>
    </div>

    <div class="g-transport">
      <div class="g-controls">
        <button type="button" class="g-btn-round" id="shuffleBtn" title="Shuffle">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        </button>
        <button type="button" class="g-btn-round" id="prevBtn" title="Previous">&#9664;&#9664;</button>
        <button type="button" class="g-btn-play" id="playPauseBtn" title="Play / pause">&#9654;</button>
        <button type="button" class="g-btn-round" id="nextBtn" title="Next">&#9654;&#9654;</button>
        <button type="button" class="g-btn-round" id="repeatBtn" title="Repeat">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
          <span class="g-repeat-badge" id="repeatBadge">1</span>
        </button>
      </div>
      <div class="g-nowplaying">
        <span class="g-nowplaying-label" id="statusLabel">Paused</span>
        <span class="g-nowplaying-title" id="nowTitle">&mdash;</span>
      </div>
      <div class="g-progress-wrap">
        <svg class="g-needle" id="progressTrack" viewBox="0 0 1000 40" preserveAspectRatio="none">
          <defs>
            <linearGradient id="steelGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#E8E8EC"/>
              <stop offset="35%" stop-color="#9C9CA6"/>
              <stop offset="55%" stop-color="#6B6B74"/>
              <stop offset="100%" stop-color="#38383E"/>
            </linearGradient>
            <linearGradient id="brassGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#F0DFA0"/>
              <stop offset="45%" stop-color="#C9A227"/>
              <stop offset="100%" stop-color="#6E4E14"/>
            </linearGradient>
            <clipPath id="needleClip"><rect id="needleClipRect" x="0" y="0" width="0" height="40"/></clipPath>
          </defs>
          <circle cx="35" cy="20" r="13" fill="none" stroke="url(#steelGrad)" stroke-width="7"/>
          <path d="M35,17 L955,15 L990,20 L955,25 L35,23 Z" fill="url(#steelGrad)"/>
          <g clip-path="url(#needleClip)">
            <circle cx="35" cy="20" r="13" fill="none" stroke="url(#brassGrad)" stroke-width="7"/>
            <path d="M35,17 L955,15 L990,20 L955,25 L35,23 Z" fill="url(#brassGrad)"/>
          </g>
          <circle id="progressBead" cx="35" cy="20" r="9" fill="#F0DFA0" stroke="#12131F" stroke-width="1.5"/>
        </svg>
        <span class="g-elapsed" id="elapsedTime">0:00 / 0:00</span>
      </div>
      <div class="g-volume">
        <span class="g-volume-label">Vol</span>
        <div class="g-volume-bars" id="volumeBars"></div>
      </div>
    </div>
  </div>
</div>

<div id="ytPlayerHidden"><div id="ytPlayer"></div></div>

<script>
(function(){
  // ---- SITE OWNER: real key already set below ----
  const SITE_API_KEY = "AIzaSyC7eCXVmSldjiW34uNZ0QlpO_zF1J9lx-k";
  const PLAYLISTS_STORAGE = 'mausiqi-playlists';

  let apiKey = SITE_API_KEY;
  let playlists = [];
  let activePlaylistIndex = 0;
  let tracks = [];
  let currentIndex = -1;
  let player = null;
  let playerReady = false;
  let isPlaying = false;
  let shuffleOn = false;
  let repeatMode = 'off'; // off | all | one
  let volume = 100;

  const gRoot = document.getElementById('g-root');
  const gNav = document.getElementById('gNav');
  const addPlaylistToggle = document.getElementById('addPlaylistToggle');
  const addPlaylistForm = document.getElementById('addPlaylistForm');
  const playlistNameInput = document.getElementById('playlistNameInput');
  const playlistLinkInput = document.getElementById('playlistLinkInput');
  const addPlaylistBtn = document.getElementById('addPlaylistBtn');
  const addStatus = document.getElementById('addStatus');
  const panelName = document.getElementById('panelName');
  const panelCount = document.getElementById('panelCount');
  const trackListEl = document.getElementById('trackList');
  const panelToggle = document.getElementById('panelToggle');
  const recordStack = document.getElementById('recordStack');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const prevBtn = document.getElementById('prevBtn');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const nextBtn = document.getElementById('nextBtn');
  const statusLabel = document.getElementById('statusLabel');
  const nowTitle = document.getElementById('nowTitle');
  const progressTrack = document.getElementById('progressTrack');
  const needleClipRect = document.getElementById('needleClipRect');
  const progressBead = document.getElementById('progressBead');
  const elapsedTime = document.getElementById('elapsedTime');
  const volumeBars = document.getElementById('volumeBars');

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2,'0');
    return m + ':' + s;
  }
  function extractPlaylistId(input){
    input = input.trim();
    const m = input.match(/[?&]list=([A-Za-z0-9_-]+)/);
    if(m) return m[1];
    if(/^[A-Za-z0-9_-]{10,}$/.test(input)) return input;
    return null;
  }

  // ---- Parallax ----
  const layers = Array.from(gRoot.querySelectorAll('[data-depth]')).map(el => ({
    el, depth: parseFloat(el.dataset.depth) || 0
  }));
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!prefersReduced){
    window.addEventListener('mousemove', (e) => {
      const r = gRoot.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      layers.forEach(({ el, depth }) => {
        const k = (depth - 0.4) * 70;
        el.style.transform = `translate3d(${-x * k}px, ${-y * k * 0.55}px, 0)`;
      });
    });
  }

  // ---- Volume bars ----
  function renderVolumeBars(){
    volumeBars.innerHTML = '';
    for(let i = 0; i < 10; i++){
      const b = document.createElement('button');
      b.type = 'button';
      b.style.height = (7 + i * 1.2) + 'px';
      if(i < Math.round(volume / 10)) b.classList.add('on');
      b.addEventListener('click', () => {
        volume = (i + 1) * 10;
        if(player && player.setVolume) player.setVolume(volume);
        renderVolumeBars();
      });
      volumeBars.appendChild(b);
    }
  }
  renderVolumeBars();

  // ---- Playlists (localStorage) ----
  function loadPlaylists(){
    try{
      const raw = localStorage.getItem(PLAYLISTS_STORAGE);
      if(raw){ playlists = JSON.parse(raw); }
    }catch(e){ playlists = []; }
  }
  function savePlaylists(){
    try{ localStorage.setItem(PLAYLISTS_STORAGE, JSON.stringify(playlists)); }
    catch(e){ console.error('save failed', e); }
  }

  addPlaylistToggle.addEventListener('click', () => {
    addPlaylistForm.classList.toggle('open');
    if(addPlaylistForm.classList.contains('open')) playlistLinkInput.focus();
  });

  addPlaylistBtn.addEventListener('click', async () => {
    const link = playlistLinkInput.value.trim();
    if(!link){ return; }
    const id = extractPlaylistId(link);
    if(!id){
      addStatus.textContent = "That doesn't look like a playlist link or ID.";
      addStatus.classList.add('error');
      return;
    }
    if(playlists.some(p => p.id === id)){
      addStatus.textContent = "Already added.";
      addStatus.classList.add('error');
      return;
    }
    addStatus.classList.remove('error');
    const name = playlistNameInput.value.trim() || ('Playlist ' + (playlists.length + 1));
    playlists.push({ name, id });
    savePlaylists();
    activePlaylistIndex = playlists.length - 1;
    renderNav();
    playlistNameInput.value = '';
    playlistLinkInput.value = '';
    addStatus.textContent = `Added "${name}"`;
    addPlaylistForm.classList.remove('open');
    loadActivePlaylist();
  });

  function renderNav(){
    // Remove existing nav items (everything before the add-toggle button)
    Array.from(gNav.querySelectorAll('.g-nav-item')).forEach(el => el.remove());
    playlists.forEach((pl, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'g-nav-item' + (i === activePlaylistIndex ? ' active' : '');
      btn.innerHTML = `<span class="g-nav-dash"></span><span>${escapeHtml(pl.name)}</span><span class="g-nav-remove">&times;</span>`;
      btn.addEventListener('click', (e) => {
        if(e.target.closest('.g-nav-remove')) return;
        activePlaylistIndex = i;
        currentIndex = -1;
        renderNav();
        loadActivePlaylist();
      });
      btn.querySelector('.g-nav-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        playlists.splice(i, 1);
        if(activePlaylistIndex >= playlists.length){ activePlaylistIndex = Math.max(0, playlists.length - 1); }
        savePlaylists();
        renderNav();
        loadActivePlaylist();
      });
      gNav.insertBefore(btn, addPlaylistToggle);
    });
  }

  async function loadActivePlaylist(){
    setPanelExpanded(false);
    if(playlists.length === 0){
      panelName.textContent = 'No playlist yet';
      panelCount.textContent = '';
      trackListEl.innerHTML = '<div class="g-empty">Add a playlist to begin.</div>';
      return;
    }
    const pl = playlists[activePlaylistIndex];
    if(!pl) return;
    panelName.textContent = pl.name;
    panelCount.textContent = 'Loading…';
    tracks = [];
    try{
      let pageToken = ''; let all = [];
      do {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${pl.id}&pageToken=${pageToken}&key=${apiKey}`);
        if(!res.ok) throw new Error('YouTube API error: ' + res.status);
        const data = await res.json();
        all = all.concat(data.items || []);
        pageToken = data.nextPageToken || '';
      } while(pageToken);

      tracks = all
        .filter(item => item.snippet && item.snippet.resourceId && item.snippet.resourceId.videoId && item.snippet.title !== 'Private video' && item.snippet.title !== 'Deleted video')
        .map(item => ({
          id: item.snippet.resourceId.videoId,
          title: item.snippet.title,
          channel: item.snippet.videoOwnerChannelTitle || item.snippet.channelTitle || 'YouTube'
        }));

      panelCount.textContent = tracks.length + (tracks.length === 1 ? ' track' : ' tracks');
      renderTrackList();
    }catch(e){
      panelCount.textContent = 'Error';
      trackListEl.innerHTML = '<div class="g-empty">Could not load this playlist. Check the API key and that it is public/unlisted.</div>';
    }
  }

  let panelExpanded = false;
  function setPanelExpanded(expanded){
    panelExpanded = expanded;
    trackListEl.classList.toggle('collapsed', !expanded);
    recordStack.classList.toggle('open', expanded);
    recordStack.classList.toggle('hidden', expanded);
  }
  panelToggle.addEventListener('click', () => setPanelExpanded(!panelExpanded));
  recordStack.addEventListener('click', () => setPanelExpanded(!panelExpanded));

  function renderTrackList(){
    trackListEl.innerHTML = '';
    if(tracks.length === 0){
      trackListEl.innerHTML = '<div class="g-empty">This playlist is empty right now.</div>';
      return;
    }
    tracks.forEach((track, i) => {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'g-track' + (i === currentIndex ? ' active' : '');
      row.innerHTML = `
        <span style="display:flex; flex-direction:column; gap:2px; min-width:0;">
          <span class="g-track-title">${escapeHtml(track.title)}</span>
          <span class="g-track-artist">${escapeHtml(track.channel)}</span>
        </span>
        <span class="g-track-eq"><i></i><i></i><i></i></span>
        <span class="g-track-len">${i === currentIndex ? '' : ''}</span>
      `;
      row.addEventListener('click', () => playTrack(i));
      trackListEl.appendChild(row);
    });
    const activeRow = trackListEl.querySelector('.g-track.active');
    if(activeRow){
      activeRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  // ---- YouTube IFrame Player ----
  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player('ytPlayer', {
      height: '1', width: '1', videoId: '',
      playerVars: { 'playsinline': 1, 'controls': 0 },
      events: {
        'onReady': () => { playerReady = true; if(player.setVolume) player.setVolume(volume); },
        'onStateChange': onPlayerStateChange
      }
    });
  };
  const ytTag = document.createElement('script');
  ytTag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(ytTag);

  function onPlayerStateChange(event){
    if(event.data === YT.PlayerState.ENDED){
      if(repeatMode === 'one'){ playTrack(currentIndex); }
      else { goNext(); }
    }
    if(event.data === YT.PlayerState.PLAYING){ setPlayingState(true); }
    if(event.data === YT.PlayerState.PAUSED){ setPlayingState(false); }
  }

  function setPlayingState(playing){
    isPlaying = playing;
    document.body.classList.toggle('is-playing', playing);
    playPauseBtn.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
    statusLabel.textContent = playing ? 'Now playing' : 'Paused';
  }

  function playTrack(i){
    if(i < 0 || i >= tracks.length) return;
    currentIndex = i;
    const track = tracks[i];
    nowTitle.textContent = track.title;
    renderTrackList();
    if(playerReady && player && player.loadVideoById){
      player.loadVideoById(track.id);
    } else {
      const check = setInterval(() => {
        if(playerReady && player && player.loadVideoById){ player.loadVideoById(track.id); clearInterval(check); }
      }, 200);
    }
  }

  function pickNextIndex(direction){
    if(tracks.length === 0) return -1;
    if(shuffleOn){
      if(tracks.length === 1) return 0;
      let next;
      do { next = Math.floor(Math.random() * tracks.length); } while(next === currentIndex);
      return next;
    }
    let next = currentIndex + direction;
    if(next >= tracks.length){ return repeatMode === 'all' ? 0 : -1; }
    if(next < 0){ return repeatMode === 'all' ? tracks.length - 1 : -1; }
    return next;
  }
  function goNext(){
    const next = pickNextIndex(1);
    if(next === -1){ player && player.pauseVideo && player.pauseVideo(); return; }
    playTrack(next);
  }
  function goPrev(){
    const prev = pickNextIndex(-1);
    if(prev === -1) return;
    playTrack(prev);
  }

  shuffleBtn.addEventListener('click', () => {
    shuffleOn = !shuffleOn;
    shuffleBtn.classList.toggle('on', shuffleOn);
  });
  repeatBtn.addEventListener('click', () => {
    repeatMode = repeatMode === 'off' ? 'all' : (repeatMode === 'all' ? 'one' : 'off');
    repeatBtn.classList.toggle('on', repeatMode !== 'off');
    document.getElementById('repeatBadge').classList.toggle('visible', repeatMode === 'one');
  });

  playPauseBtn.addEventListener('click', () => {
    if(!player) return;
    if(currentIndex === -1 && tracks.length > 0){ playTrack(0); return; }
    if(isPlaying){ player.pauseVideo(); } else { player.playVideo(); }
  });
  nextBtn.addEventListener('click', goNext);
  prevBtn.addEventListener('click', goPrev);

  progressTrack.addEventListener('click', (e) => {
    if(!player || !player.getDuration) return;
    const rect = progressTrack.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    const dur = player.getDuration();
    if(dur > 0){ player.seekTo(dur * ratio, true); }
  });

  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement.tagName;
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    if(e.code === 'Space'){ e.preventDefault(); playPauseBtn.click(); }
    else if(e.code === 'ArrowRight'){ goNext(); }
    else if(e.code === 'ArrowLeft'){ goPrev(); }
  });

  const NEEDLE_START = 35, NEEDLE_END = 990;
  function setNeedleProgress(ratio){
    ratio = Math.max(0, Math.min(1, ratio));
    needleClipRect.setAttribute('width', (ratio * 1000).toFixed(1));
    progressBead.setAttribute('cx', (NEEDLE_START + ratio * (NEEDLE_END - NEEDLE_START)).toFixed(1));
  }

  setInterval(() => {
    if(!player || !player.getCurrentTime || currentIndex === -1) return;
    try{
      const cur = player.getCurrentTime();
      const dur = player.getDuration();
      if(dur > 0){
        setNeedleProgress(cur / dur);
        elapsedTime.textContent = fmtTime(cur) + ' / ' + fmtTime(dur);
      }
    }catch(e){}
  }, 500);

  loadPlaylists();
  renderNav();
  loadActivePlaylist();
})();
</script>

</body>
</html>
