<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mausiqi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#12131F; }
  a { color:#C9A227; text-decoration:none; }
  ::selection { background:rgba(201,162,39,.3); }
  *:focus-visible { outline:2px solid #C9A227; outline-offset:2px; }
  button { font-family:inherit; }

  @keyframes g-spin { to { transform: rotate(360deg); } }
  @keyframes g-ring { 0% { transform:scale(.9); opacity:.5; } 100% { transform:scale(1.5); opacity:0; } }
  @keyframes g-mote { 0% { transform: translate3d(0,30px,0) scale(.5); opacity:0; } 20% { opacity:.9; } 80% { opacity:.4; } 100% { transform: translate3d(30px,-320px,0) scale(1.1); opacity:0; } }
  @keyframes g-eq { 0%,100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }
  @keyframes g-in { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform:none; } }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
  }

  #g-root{ position:relative; width:100vw; height:100vh; overflow:hidden; background:#12131F; color:#F5E6C8; font-family:'Work Sans',sans-serif; perspective:1000px; perspective-origin:50% 46%; }

  .g-bg{ position:absolute; inset:-10%; background:radial-gradient(100% 90% at 50% 54%, rgba(139,38,53,.28) 0%, rgba(18,19,31,0) 62%), linear-gradient(180deg, #0E0F19, #12131F 50%, #191423); pointer-events:none; }
  .g-grain{ position:absolute; inset:-8%; opacity:.28; pointer-events:none; background-image:radial-gradient(rgba(245,230,200,.32) 1px, transparent 1.3px); background-size:30px 30px; mask-image:radial-gradient(72% 66% at 50% 46%, #000, transparent 76%); -webkit-mask-image:radial-gradient(72% 66% at 50% 46%, #000, transparent 76%); }
  .g-grooves{ position:absolute; left:50%; top:50%; width:min(150vh,150vw); height:min(150vh,150vw); margin:calc(min(150vh,150vw) / -2) 0 0 calc(min(150vh,150vw) / -2); pointer-events:none; opacity:.34; border-radius:50%; background:repeating-radial-gradient(circle at 50% 50%, rgba(245,230,200,.11) 0 1px, rgba(0,0,0,0) 1px 13px); }

  .g-disc-wrap{ position:absolute; left:50%; top:50%; width:min(72vh,60vw); height:min(72vh,60vw); margin:calc(min(72vh,60vw) / -2) 0 0 calc(min(72vh,60vw) / -2); pointer-events:none; }
  .scene-canvas-wrap{ position:absolute; inset:0; }
  .scene-canvas-wrap canvas{ display:block; width:100%; height:100%; }
  #g-scene{ z-index:0; }
  #m-scene-bg{ z-index:0; pointer-events:none; }
  body.has-webgl3d .fallback-bg{ display:none !important; }
  .g-disc-glow{ position:absolute; inset:-18%; border-radius:50%; background:radial-gradient(closest-side, rgba(201,162,39,.2), rgba(18,19,31,0) 72%); filter:blur(8px); }
  .g-disc{ position:absolute; inset:0; border-radius:50%; overflow:hidden; box-shadow:0 40px 80px rgba(0,0,0,.66), inset 0 0 0 1px rgba(245,230,200,.08);
    animation:g-spin 4.2s linear infinite; animation-play-state:paused;
    background: repeating-radial-gradient(circle at 50% 50%, rgba(245,230,200,.05) 0 1px, rgba(0,0,0,0) 1px 5px), repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.6) 0 2px, rgba(255,255,255,.02) 2px 6px), radial-gradient(circle at 50% 50%, #221e29 0 24%, #14131c 24% 76%, #201b25 76% 100%); }
  body.is-playing .g-disc{ animation-play-state:running; }
  .g-disc-sheen{ position:absolute; inset:0; border-radius:50%; mix-blend-mode:screen; opacity:.62; pointer-events:none; background:conic-gradient(from 0deg, rgba(245,230,200,.14), rgba(245,230,200,0) 24%, rgba(201,162,39,.22) 44%, rgba(245,230,200,0) 64%, rgba(139,38,53,.26) 84%, rgba(245,230,200,.12) 100%); }
  .g-label{ position:absolute; left:50%; top:50%; width:30%; height:30%; margin:-15% 0 0 -15%; border-radius:50%; background:radial-gradient(circle at 40% 34%, #A32E3F, #8B2635 62%, #6D1D29); box-shadow:0 0 0 1px rgba(201,162,39,.45); display:flex; align-items:center; justify-content:center; }
  .g-label-title{ position:absolute; left:0; right:0; top:50%; transform:translateY(-176%); text-align:center; font-family:'Amiri',serif; font-size:17px; line-height:1.3; letter-spacing:.03em; color:#F5E6C8; }
  .g-label-sub{ position:absolute; left:0; right:0; top:50%; transform:translateY(86%); text-align:center; font-family:'Amiri',serif; font-size:13px; line-height:1.4; color:#C9A227; }
  .g-spindle{ position:absolute; left:50%; top:50%; width:2.6%; height:2.6%; margin:-1.3% 0 0 -1.3%; border-radius:50%; background:#12131F; }
  .g-ring{ position:absolute; inset:0; border-radius:50%; border:1px solid rgba(201,162,39,.4); animation:g-ring 5s ease-out infinite; animation-play-state:paused; }
  .g-ring2{ position:absolute; inset:0; border-radius:50%; border:1px solid rgba(139,38,53,.5); animation:g-ring 5s ease-out infinite; animation-delay:2.5s; animation-play-state:paused; }
  body.is-playing .g-ring, body.is-playing .g-ring2{ animation-play-state:running; }

  .g-motes span{ position:absolute; border-radius:50%; animation:g-mote linear infinite; }

  .g-content{ position:absolute; inset:0; z-index:6; display:grid; grid-template-columns:auto 1fr 372px; grid-template-rows:auto 1fr auto; gap:0 42px; padding:40px 52px 34px; pointer-events:none; }
  .g-content > *{ pointer-events:auto; }

  .g-header{ grid-column:1 / 3; animation:g-in .85s ease-out both; }
  .g-title{ font-family:'Amiri',serif; font-weight:700; font-size:52px; line-height:1.1; text-shadow:0 4px 26px rgba(18,19,31,.9); }
  .g-tagline{ margin:12px 0 0; font-family:'Amiri',serif; font-style:italic; font-size:19px; color:rgba(245,230,200,.7); text-shadow:0 2px 18px rgba(18,19,31,.9); }

  .g-nav{ grid-row:2; grid-column:1; display:flex; flex-direction:column; justify-content:center; gap:8px; animation:g-in 1.05s ease-out both; max-height:70vh; overflow-y:auto; scrollbar-width:none; }
  .g-nav::-webkit-scrollbar{ display:none; }
  .g-nav-item{ display:flex; align-items:center; gap:11px; padding:9px 0; border:none; background:transparent; color:rgba(245,230,200,.5); font-family:'Work Sans',sans-serif; font-size:11px; letter-spacing:.2em; text-transform:uppercase; text-align:left; cursor:pointer; transition:color .2s; white-space:nowrap; }
  .g-nav-item:hover{ color:#F5E6C8; }
  .g-nav-item.active{ color:#F5E6C8; }
  .g-nav-dash{ width:16px; height:1px; background:rgba(245,230,200,.28); transition:width .25s, background .25s; flex-shrink:0; }
  .g-nav-item.active .g-nav-dash{ width:38px; background:#C9A227; }
  .g-nav-remove{ margin-left:auto; opacity:0; background:none; border:none; color:rgba(245,230,200,.4); font-size:11px; cursor:pointer; padding:0 4px; }
  .g-nav-item:hover .g-nav-remove{ opacity:1; }
  .g-nav-remove:hover{ color:#C9A227; }
  .g-nav-add{ display:flex; align-items:center; gap:11px; margin-top:6px; padding:9px 0; border:none; background:transparent; color:rgba(245,230,200,.42); font-family:'Work Sans',sans-serif; font-size:11px; letter-spacing:.2em; text-transform:uppercase; cursor:pointer; transition:color .2s; }
  .g-nav-add:hover{ color:#C9A227; }

  .g-add-form{ display:none; flex-direction:column; gap:6px; margin-top:8px; }
  .g-add-form.open{ display:flex; }
  .g-add-form input{ background:rgba(10,10,17,.6); border:1px solid rgba(245,230,200,.18); border-radius:3px; padding:7px 9px; color:#F5E6C8; font-family:'Work Sans',sans-serif; font-size:11px; outline:none; width:190px; }
  .g-add-form input:focus{ border-color:#C9A227; }
  .g-add-form input::placeholder{ color:rgba(245,230,200,.35); }
  .g-add-form-row{ display:flex; gap:6px; }
  .g-add-form button{ background:#C9A227; color:#12131F; border:none; border-radius:3px; padding:0 12px; font-size:11px; font-weight:600; cursor:pointer; letter-spacing:.05em; }
  .g-add-form button:hover{ background:#E4C24A; }
  .g-add-status{ font-size:10px; color:rgba(245,230,200,.45); margin-top:2px; max-width:190px; }
  .g-add-status.error{ color:#E08A8A; }

  .g-panel{ grid-row:1 / 3; grid-column:3; display:flex; flex-direction:column; min-height:0; justify-content:center; animation:g-in 1.2s ease-out both; }
  .g-panel-head{ display:flex; align-items:baseline; justify-content:space-between; padding:0 4px 14px; cursor:pointer; }
  .g-panel-name{ font-size:10px; letter-spacing:.26em; text-transform:uppercase; color:#C9A227; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
  .g-panel-count{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(245,230,200,.4); white-space:nowrap; }

  .g-panel-body{ position:relative; height:268px; }

  .g-tracklist{ position:absolute; inset:0; display:flex; flex-direction:column; padding:8px; background:rgba(10,10,17,.5); backdrop-filter:blur(9px); border-radius:2px;
    opacity:0; transform:translateY(10px) scale(.97); pointer-events:none;
    transition:opacity .3s ease, transform .3s ease; }
  .g-panel-body.expanded .g-tracklist{ opacity:1; transform:none; pointer-events:auto; transition-delay:.38s; }
  #trackRows{ display:flex; flex-direction:column; gap:1px; overflow-y:auto; flex:1 1 auto; scrollbar-width:thin; scrollbar-color:#C9A227 rgba(245,230,200,.06); }

  .g-stack{ position:absolute; inset:0; width:100%; border:none; background:transparent; cursor:pointer; padding:10px 0 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    opacity:1; transition:opacity .28s ease; }
  .stack-disc{ transition: transform .45s cubic-bezier(.34,1.4,.64,1); transform-box:fill-box; transform-origin:center; filter:drop-shadow(0 6px 7px rgba(0,0,0,.5)); }
  .g-panel-body.expanded .stack-disc.sd1{ transform: translate(34px,-44px) rotate(13deg); }
  .g-panel-body.expanded .stack-disc.sd2{ transform: translate(-28px,-16px) rotate(-9deg); }
  .g-panel-body.expanded .stack-disc.sd3{ transform: translate(26px,8px) rotate(7deg); }
  .g-panel-body.expanded .stack-disc.sd4{ transform: translate(-22px,22px) rotate(-6deg); }
  .g-panel-body.expanded .g-stack{ opacity:0; pointer-events:none; transition-delay:.34s; }
  .g-stack:hover{ opacity:.85; }
  .g-panel-body.expanded .g-stack:hover{ opacity:0; }
  .g-stack:hover ellipse:last-of-type{ filter:brightness(1.15); }
  .g-stack-hint{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:rgba(245,230,200,.42); }
  .g-mini-toggle{ border:1px solid rgba(201,162,39,.35); background:rgba(245,230,200,.05); color:#C9A227; font-family:'Work Sans',sans-serif; font-size:10px; letter-spacing:.12em; text-transform:uppercase; padding:5px 12px; border-radius:12px; cursor:pointer; transition:background .2s, border-color .2s; position:relative; z-index:2; }
  .g-mini-toggle:hover{ background:rgba(201,162,39,.16); border-color:#E4C24A; }
  .g-hide-toggle{ display:block; margin:0 auto 6px auto; flex-shrink:0; }
  #stackChevron{ transition: transform .25s ease; transform-origin:130px 130px; }
  .g-panel-body.expanded #stackChevron{ transform: rotate(180deg); }
  .g-tracklist::-webkit-scrollbar{ width:7px; }
  .g-tracklist::-webkit-scrollbar-track{ background:rgba(245,230,200,.06); border-radius:4px; }
  .g-tracklist::-webkit-scrollbar-thumb{ background:linear-gradient(180deg, #C9A227, #8B2635); border-radius:4px; border:1px solid rgba(18,19,31,.4); }
  .g-tracklist::-webkit-scrollbar-thumb:hover{ background:linear-gradient(180deg, #E4C24A, #A32E3F); }

  .g-nav::-webkit-scrollbar{ width:5px; }
  .g-nav::-webkit-scrollbar-track{ background:transparent; }
  .g-nav::-webkit-scrollbar-thumb{ background:rgba(201,162,39,.4); border-radius:3px; }
  .g-nav{ scrollbar-color:rgba(201,162,39,.4) transparent; }
  .g-track{ display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:12px; padding:7px 10px; border:none; border-left:2px solid transparent; border-radius:1px; background:transparent; color:rgba(245,230,200,.76); font-family:'Work Sans',sans-serif; text-align:left; cursor:pointer; transition:background .2s, border-color .2s, color .2s; width:100%; }
  .g-track{ transition:background .2s, border-color .2s, color .2s, transform .18s; }
  .g-track:hover{ background:rgba(245,230,200,.08); color:#F5E6C8; transform:translateX(3px); }
  .g-track.active .g-track-title{ color:#E4C24A; }
  .g-track.active{ background:rgba(139,38,53,.3); border-left-color:#C9A227; color:#F5E6C8; }
  .g-track-title{ font-family:'Amiri',serif; font-size:17px; line-height:1.6; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .g-track-artist{ font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:rgba(245,230,200,.4); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block; }
  .g-track-eq{ display:flex; align-items:flex-end; gap:2px; height:11px; opacity:0; }
  .g-track.active .g-track-eq{ opacity:1; }
  .g-track-eq i{ display:block; width:2px; height:11px; background:#C9A227; transform-origin:bottom; animation:g-eq .9s ease-in-out infinite; animation-play-state:paused; }
  .g-track-eq i:nth-child(2){ animation-duration:.7s; animation-delay:.16s; }
  .g-track-eq i:nth-child(3){ animation-duration:1.1s; animation-delay:.32s; }
  body.is-playing .g-track-eq i{ animation-play-state:running; }
  .g-track-len{ font-size:11px; color:rgba(245,230,200,.38); font-variant-numeric:tabular-nums; }
  .g-empty{ padding:20px 10px; text-align:center; font-family:'Amiri',serif; font-style:italic; font-size:13px; color:rgba(245,230,200,.4); }

  .g-transport{ grid-row:3; grid-column:1 / -1; display:flex; align-items:center; gap:30px; padding-top:26px; animation:g-in 1.35s ease-out both; }
  .g-controls{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .g-btn-round{ position:relative; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(201,162,39,.35);
    background: radial-gradient(circle at 34% 30%, #2c2418, #16130f 78%);
    color:rgba(245,230,200,.85); font-size:13px; cursor:pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.55), inset 0 1px 0 rgba(245,230,200,.12), inset 0 -3px 5px rgba(0,0,0,.6);
    transition: box-shadow .2s, border-color .2s, transform .12s; }
  .g-btn-round:hover{ border-color:#C9A227; box-shadow:0 3px 10px rgba(0,0,0,.6), 0 0 14px rgba(201,162,39,.35), inset 0 1px 0 rgba(245,230,200,.18), inset 0 -3px 5px rgba(0,0,0,.6); }
  .g-btn-round:active{ transform: scale(.93); }
  .g-btn-round.on{ border-color:#F0DFA0; color:#211a0d;
    background: radial-gradient(circle at 34% 30%, #F0DFA0, #C9A227 55%, #8f6f1a 100%);
    box-shadow: 0 3px 8px rgba(0,0,0,.5), 0 0 16px rgba(201,162,39,.5), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 4px rgba(70,50,10,.5); }
  .g-repeat-badge{ display:none; position:absolute; bottom:-3px; right:-3px; width:14px; height:14px; border-radius:50%; background:#8B2635; color:#F5E6C8; font-size:9px; font-weight:600; line-height:14px; text-align:center; border:1px solid rgba(18,19,31,.6); }
  .g-repeat-badge.visible{ display:block; }
  .g-btn-play{ width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
    border:2px solid #3a2f1a;
    background: radial-gradient(circle at 35% 28%, #F0DFA0, #C9A227 55%, #8f6f1a 100%);
    color:#211a0d; font-size:16px;
    box-shadow: 0 8px 18px rgba(0,0,0,.5), 0 0 0 3px rgba(201,162,39,.15), inset 0 2px 2px rgba(255,255,255,.5), inset 0 -3px 6px rgba(70,50,10,.5);
    transition: transform .18s, box-shadow .2s; }
  .g-btn-play:hover{ transform:translateY(-2px); box-shadow: 0 10px 22px rgba(0,0,0,.55), 0 0 0 3px rgba(201,162,39,.25), inset 0 2px 2px rgba(255,255,255,.55), inset 0 -3px 6px rgba(70,50,10,.5); }
  .g-btn-play:active{ transform:translateY(0) scale(.95); }

  .g-nowplaying{ display:flex; flex-direction:column; gap:5px; min-width:0; width:180px; flex-shrink:0; }
  .g-nowplaying-label{ font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:#C9A227; }
  .g-nowplaying-title{ font-family:'Amiri',serif; font-size:20px; line-height:1.5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .g-progress-wrap{ flex:0 1 420px; display:flex; align-items:center; gap:16px; min-width:0; }
  .g-needle{ flex:0 0 460px; width:460px; height:16px; cursor:pointer; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  #progressBead, #m-progressBead{ filter:drop-shadow(0 0 4px rgba(240,223,160,.7)); }
  #progressBead{ transition: cx 0.15s linear; }
  .g-elapsed{ font-size:11px; color:rgba(245,230,200,.44); font-variant-numeric:tabular-nums; white-space:nowrap; }

  .g-volume{ display:flex; align-items:center; gap:9px; flex-shrink:0; margin-left:auto; }
  .g-volume-label{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(245,230,200,.4); }
  .g-volume-bars{ display:flex; align-items:flex-end; gap:3px; height:18px; }
  .g-volume-bars button{ width:5px; padding:0; border:none; border-radius:1px; background:rgba(245,230,200,.2); cursor:pointer; }
  .g-volume-bars button.on{ background:#C9A227; }

  #ytPlayerHidden{ position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; }

  @media (max-width: 900px){
    .g-content{ grid-template-columns:1fr; grid-template-rows:auto auto 1fr auto; padding:18px 16px 14px; gap:12px; min-width:0; }
    .g-header{ grid-column:1; min-width:0; }
    .g-title{ font-size:30px; }
    .g-tagline{ font-size:13px; }
    .g-nav{ grid-row:2; grid-column:1; flex-direction:row; flex-wrap:wrap; max-height:none; min-width:0; }
    .g-panel{ grid-row:3; grid-column:1; min-width:0; }
    .g-panel-body{ height:240px; }
    .g-disc-wrap{ width:min(42vh,58vw); height:min(42vh,58vw); }

    .g-transport{ grid-row:4; grid-column:1; flex-wrap:wrap; gap:12px; min-width:0; padding-top:16px; }
    .g-controls{ order:1; }
    .g-nowplaying{ order:2; width:auto; max-width:150px; }
    .g-progress-wrap{ order:4; flex:1 1 100%; min-width:0; }
    .g-needle{ flex:1 1 auto; width:100%; min-width:0; height:14px; }
    .g-elapsed{ flex-shrink:0; }
    .g-volume{ order:3; margin-left:0; }
  }
  @media (max-width: 480px){
    .g-nav-item span:not(.g-nav-dash){ font-size:10px; }
    .g-nowplaying{ max-width:110px; }
    .g-controls{ gap:8px; }
    .g-btn-round{ width:34px; height:34px; }
    .g-btn-play{ width:48px; height:48px; }
  }

  /* ============ MOBILE LAYOUT (phone-native, <=700px) ============ */
  #m-root{ display:none; }
  @media (max-width: 700px){
    #g-root{ display:none !important; }
    #m-root{
      display:flex; flex-direction:column;
      width:100vw; height:100vh; height:100dvh; overflow:hidden;
      position:relative; color:#F5E6C8; font-family:'Work Sans',sans-serif;
      background:#12131F;
    }
    .m-bg{ position:absolute; inset:0; pointer-events:none;
      background:radial-gradient(120% 70% at 50% 30%, rgba(139,38,53,.22) 0%, rgba(18,19,31,0) 65%),
                 linear-gradient(180deg, #0E0F19, #12131F 55%, #191423); }

    .m-head{ position:relative; z-index:2; display:flex; align-items:baseline; justify-content:space-between; padding:14px 16px 8px; }
    .m-brand{ display:flex; align-items:baseline; gap:8px; }
    .m-title{ font-family:'Amiri',serif; font-weight:700; font-size:24px; }
    .m-title-fa{ font-family:'Amiri',serif; font-size:14px; color:#C9A227; direction:rtl; }
    .m-count{ font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:rgba(245,230,200,.45); }

    .m-nav-wrap{ position:relative; z-index:2; padding:0 16px 4px; }
    .m-nav{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .m-nav::-webkit-scrollbar{ display:none; }
    #m-root .g-nav-item{ flex:0 0 auto; display:flex; align-items:center; gap:6px;
      border:1px solid rgba(201,162,39,.3); background:rgba(27,29,48,.55); border-radius:18px;
      color:rgba(245,230,200,.6); padding:8px 14px; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
      white-space:nowrap; cursor:pointer; }
    #m-root .g-nav-item.active{ background:#C9A227; color:#12131F; border-color:#C9A227; font-weight:600; }

<script>
// ============ Mausiqi 3D scene module (shared record + ambient background) ============
window.mausiqi3D = { setPlaying: function(){} };
(function(){
  function hasWebGL(){
    try{
      const c = document.createElement('canvas');
      return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
    }catch(e){ return false; }
  }
  if(typeof THREE === 'undefined' || !hasWebGL()) return;

  function makeVinylTexture(withText){
    const S = 1024, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const ctx = cv.getContext('2d');
    const cx = S/2, cy = S/2;
    ctx.fillStyle = '#141219'; ctx.fillRect(0, 0, S, S);
    for(let r = 150; r < 500; r += 2.2){
      const a = 0.05 + Math.random()*0.10;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(245,230,200,' + a.toFixed(3) + ')';
      ctx.lineWidth = 0.8 + Math.random()*0.5;
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx, cy, 150, 0, Math.PI*2); ctx.fillStyle = '#191622'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, 138, 0, Math.PI*2);
    const lab = ctx.createRadialGradient(cx-30, cy-34, 10, cx, cy, 140);
    lab.addColorStop(0, '#A32E3F'); lab.addColorStop(0.65, '#8B2635'); lab.addColorStop(1, '#6D1D29');
    ctx.fillStyle = lab; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(201,162,39,.8)';
    ctx.beginPath(); ctx.arc(cx, cy, 138, 0, Math.PI*2); ctx.stroke();
    if(withText){
      ctx.textAlign = 'center'; ctx.fillStyle = '#F5E6C8';
      ctx.font = '700 44px Amiri, serif'; ctx.fillText('Mausiqi', cx, cy - 18);
      ctx.fillStyle = '#C9A227'; ctx.font = '400 34px Amiri, serif';
      ctx.fillText('\u0645\u0648\u0633\u06cc\u0642\u06cc', cx, cy + 40);
    }
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI*2); ctx.fillStyle = '#0c0b12'; ctx.fill();
    const tex = new THREE.CanvasTexture(cv);
    tex.anisotropy = 8;
    return tex;
  }

  function makeGlowTexture(){
    const s = 256, cv = document.createElement('canvas');
    cv.width = cv.height = s;
    const ctx = cv.getContext('2d');
    const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,0.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
    return new THREE.CanvasTexture(cv);
  }

  const faceTex = makeVinylTexture(true);
  const bumpTex = makeVinylTexture(false);
  const glowTex = makeGlowTexture();
  document.fonts && document.fonts.ready && document.fonts.ready.then(function(){
    const fresh = makeVinylTexture(true);
    instances.forEach(function(inst){ if(inst.faceMat){ inst.faceMat.map = fresh; inst.faceMat.needsUpdate = true; } });
  });

  const instances = [];

  function createScene(container, opts){
    opts = opts || {};
    const isFullBg = !!opts.fullBackground;
    const particleCount = opts.particleCount || 0;
    const withOrbs = !!opts.withOrbs;
    const withDrag = opts.withDrag !== false;
    const withRecord = opts.withRecord !== false;
    const onTap = opts.onTap || null;

    const scene = new THREE.Scene();
    const fov = 36;
    const camera = new THREE.PerspectiveCamera(fov, 1, 0.1, 100);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x36322c, 1.0));
    const key = new THREE.DirectionalLight(0xfff2d8, 1.15); key.position.set(-4,7,6); scene.add(key);
    const rim = new THREE.PointLight(0x8B2635, 1.4, 30); rim.position.set(6,1.5,4); scene.add(rim);
    const brass = new THREE.PointLight(0xC9A227, 0.7, 25); brass.position.set(-6,-3,5); scene.add(brass);

    const R = 4.4;
    let record = null, tiltGroup = null, faceMat = null;
    if(withRecord){
      faceMat = new THREE.MeshPhongMaterial({ map: faceTex, bumpMap: bumpTex, bumpScale: 0.015, shininess: 68, specular: new THREE.Color(0x5a5348) });
      const edgeMat = new THREE.MeshPhongMaterial({ color: 0x191722, shininess: 30, specular: 0x33302a });
      const geo = new THREE.CylinderGeometry(R, R, 0.14, 96);
      record = new THREE.Mesh(geo, [edgeMat, faceMat, faceMat]);
      record.rotation.y = Math.PI / 2;

      tiltGroup = new THREE.Group();
      tiltGroup.add(record);
      scene.add(tiltGroup);
      tiltGroup.rotation.x = 0.92;
    }

    // particles
    let pGeo, pMat, particles, pPhase, pSpeed, spreadX = 9, spreadY = 5.5, spreadZ = [-6,3];
    if(particleCount > 0){
      if(!isFullBg){ spreadX = 3.4; spreadY = 3.4; spreadZ = [-3,1]; }
      pGeo = new THREE.BufferGeometry();
      const pos = new Float32Array(particleCount*3), col = new Float32Array(particleCount*3);
      pPhase = new Float32Array(particleCount); pSpeed = new Float32Array(particleCount);
      const palette = [[0.96,0.90,0.78],[0.79,0.64,0.15],[0.55,0.15,0.21]];
      for(let i=0;i<particleCount;i++){
        pos[i*3] = (Math.random()-0.5)*spreadX*2;
        pos[i*3+1] = (Math.random()-0.5)*spreadY*2;
        pos[i*3+2] = spreadZ[0] + Math.random()*(spreadZ[1]-spreadZ[0]);
        const cSel = palette[Math.random()<0.62?0:(Math.random()<0.6?1:2)];
        col[i*3]=cSel[0]; col[i*3+1]=cSel[1]; col[i*3+2]=cSel[2];
        pPhase[i] = Math.random()*Math.PI*2;
        pSpeed[i] = 0.0015 + Math.random()*0.003;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pos,3));
      pGeo.setAttribute('color', new THREE.BufferAttribute(col,3));
      pMat = new THREE.PointsMaterial({ size: isFullBg?0.055:0.045, vertexColors:true, transparent:true, opacity:0.75, depthWrite:false });
      particles = new THREE.Points(pGeo, pMat);
      scene.add(particles);
    }

    const orbs = [];
    if(withOrbs){
      const specs = [
        {color:0x8B2635, scale:isFullBg?9:4, x:-6,y:2.5,z:-5, sp:0.00022},
        {color:0xC9A227, scale:isFullBg?7:3.2, x:6,y:-2.0,z:-4, sp:0.00030},
        {color:0x8B2635, scale:isFullBg?6:3, x:2,y:3.5,z:-6, sp:0.00026}
      ];
      specs.forEach(function(s){
        const mat = new THREE.SpriteMaterial({ map:glowTex, color:s.color, transparent:true, opacity:0.14, blending:THREE.AdditiveBlending, depthWrite:false });
        const spr = new THREE.Sprite(mat);
        spr.position.set(s.x,s.y,s.z); spr.scale.setScalar(s.scale);
        scene.add(spr);
        orbs.push({spr:spr, baseX:s.x, baseY:s.y, sp:s.sp, phase:Math.random()*6});
      });
    }

    let playing = false, spinVel = 0;
    const BASE_SPIN = 0.02;
    let targetTiltX = 0.92, targetTiltZ = 0;
    let dragging = false, lastX = 0, lastY = 0, dragDist = 0;

    function onDown(clientX, clientY){
      if(!withDrag) return;
      dragging = true; lastX = clientX; lastY = clientY; dragDist = 0;
    }
    function onMoveDrag(clientX, clientY){
      if(!dragging) return;
      const dx = clientX - lastX, dy = clientY - lastY;
      dragDist += Math.abs(dx) + Math.abs(dy);
      spinVel += dx * 0.0035;
      lastX = clientX; lastY = clientY;
    }
    function onUp(){
      if(!dragging) return;
      dragging = false;
      // if this was a genuine drag (not a simple tap), suppress the native click
      // that's about to fire on the enclosing button, so spinning the record
      // doesn't also toggle the track list open/closed.
      if(dragDist >= 6 && onTap){
        const suppress = function(e){ e.stopPropagation(); };
        container.addEventListener('click', suppress, { capture:true, once:true });
      }
    }
    if(withDrag){
      container.style.cursor = 'grab';
      container.addEventListener('mousedown', function(e){ onDown(e.clientX, e.clientY); });
      window.addEventListener('mousemove', function(e){ onMoveDrag(e.clientX, e.clientY); });
      window.addEventListener('mouseup', onUp);
      container.addEventListener('touchstart', function(e){ const t=e.touches[0]; onDown(t.clientX, t.clientY); }, {passive:true});
      container.addEventListener('touchmove', function(e){ const t=e.touches[0]; onMoveDrag(t.clientX, t.clientY); }, {passive:true});
      container.addEventListener('touchend', onUp);
    }

    if(isFullBg){
      window.addEventListener('mousemove', function(e){
        const nx = e.clientX / window.innerWidth - 0.5;
        const ny = e.clientY / window.innerHeight - 0.5;
        targetTiltX = 0.92 + ny*0.20;
        targetTiltZ = -nx*0.16;
      });
    }

    function resize(){
      const w = container.clientWidth, h = container.clientHeight;
      if(w < 2 || h < 2) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      let targetPx;
      if(isFullBg){
        targetPx = Math.min(window.innerHeight * 0.72, window.innerWidth * 0.60);
      } else {
        targetPx = h * 0.94;
      }
      const fovRad = fov * Math.PI / 180;
      const dist = (R * h) / (targetPx * Math.tan(fovRad/2));
      camera.position.set(0, 0, dist);
      camera.lookAt(0,0,0);
      camera.updateProjectionMatrix();
    }
    resize();
    window.addEventListener('resize', resize);

    let t = 0;
    function animate(){
      requestAnimationFrame(animate);
      if(container.clientWidth < 1) return;
      t += 0.016;
      spinVel *= 0.965;
      if(record){
        record.rotation.y += spinVel + (playing ? BASE_SPIN : 0);
        tiltGroup.rotation.x += (targetTiltX - tiltGroup.rotation.x) * 0.06;
        tiltGroup.rotation.z += (targetTiltZ - tiltGroup.rotation.z) * 0.06;
      }

      if(particles){
        const pos = pGeo.attributes.position.array;
        for(let i=0;i<particleCount;i++){
          pos[i*3+1] += pSpeed[i];
          pos[i*3] += Math.sin(t*0.6 + pPhase[i]) * 0.0012;
          if(pos[i*3+1] > spreadY){ pos[i*3+1] = -spreadY; pos[i*3] = (Math.random()-0.5)*spreadX*2; }
        }
        pGeo.attributes.position.needsUpdate = true;
        pMat.opacity = 0.55 + Math.sin(t*0.8)*0.15;
      }
      orbs.forEach(function(o){
        o.spr.position.x = o.baseX + Math.sin(t*o.sp*900 + o.phase)*1.2;
        o.spr.position.y = o.baseY + Math.cos(t*o.sp*700 + o.phase)*0.8;
      });
      renderer.render(scene, camera);
    }
    animate();

    const inst = { faceMat: faceMat, setPlaying: function(p){ playing = p; } };
    instances.push(inst);
    return inst;
  }

  document.body.classList.add('has-webgl3d');

  const gScene = document.getElementById('g-scene');
  const mScene = document.getElementById('m-scene');
  const mSceneBg = document.getElementById('m-scene-bg');
  const gInst = gScene ? createScene(gScene, { fullBackground:true, particleCount:320, withOrbs:true, withDrag:true }) : null;
  const mBgInst = mSceneBg ? createScene(mSceneBg, { fullBackground:true, particleCount:320, withOrbs:true, withDrag:false, withRecord:false }) : null;
  const mInst = mScene ? createScene(mScene, { fullBackground:false, particleCount:0, withOrbs:false, withDrag:true, onTap:true }) : null;

  window.mausiqi3D.setPlaying = function(p){
    if(gInst) gInst.setPlaying(p);
    if(mInst) mInst.setPlaying(p);
  };
})();
</script>

<script>
(function(){
  // Layout resolution: on phone widths, ids prefixed "m-" take priority so
  // the same logic drives whichever layout is visible.
  const isMobileLayout = window.matchMedia('(max-width: 700px)').matches;
  function $id(id){
    if(isMobileLayout){
      const m = document.getElementById('m-' + id);
      if(m) return m;
    }
    return document.getElementById(id);
  }
  window.matchMedia('(max-width: 700px)').addEventListener('change', () => location.reload());

  // ---- SITE OWNER: real key already set below ----
  const SITE_API_KEY = "AIzaSyC7eCXVmSldjiW34uNZ0QlpO_zF1J9lx-k";
  const PLAYLISTS_STORAGE = 'mausiqi-playlists';

  let apiKey = SITE_API_KEY;
  let playlists = [];
  let activePlaylistIndex = 0;
  let tracks = [];
  let currentIndex = -1;
  let player = null;
  let playerReady = false;
  let isPlaying = false;
  let shuffleOn = false;
  let repeatMode = 'off'; // off | all | one
  let volume = 100;

  const gRoot = $id('g-root');
  const gNav = $id('gNav');
  const addPlaylistToggle = $id('addPlaylistToggle');
  const addPlaylistForm = $id('addPlaylistForm');
  const playlistNameInput = $id('playlistNameInput');
  const playlistLinkInput = $id('playlistLinkInput');
  const addPlaylistBtn = $id('addPlaylistBtn');
  const addStatus = $id('addStatus');
  const panelName = $id('panelName');
  const panelCount = $id('panelCount');
  const trackListEl = $id('trackList');
  const trackRowsEl = $id('trackRows');
  const showTracksBtn = $id('showTracksBtn');
  const hideTracksBtn = $id('hideTracksBtn');
  const panelToggle = $id('panelToggle');
  const recordStack = $id('recordStack');
  const shuffleBtn = $id('shuffleBtn');
  const repeatBtn = $id('repeatBtn');
  const prevBtn = $id('prevBtn');
  const playPauseBtn = $id('playPauseBtn');
  const nextBtn = $id('nextBtn');
  const statusLabel = $id('statusLabel');
  const nowTitle = $id('nowTitle');
  const progressTrack = $id('progressTrack');
  const needleClipRect = $id('needleClipRect');
  const progressBead = $id('progressBead');
  const elapsedTime = $id('elapsedTime');
  const volumeBars = $id('volumeBars');

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2,'0');
    return m + ':' + s;
  }
  function extractPlaylistId(input){
    input = input.trim();
    const m = input.match(/[?&]list=([A-Za-z0-9_-]+)/);
    if(m) return m[1];
    if(/^[A-Za-z0-9_-]{10,}$/.test(input)) return input;
    return null;
  }

  // ---- Parallax ----
  const layers = Array.from(gRoot.querySelectorAll('[data-depth]')).map(el => ({
    el, depth: parseFloat(el.dataset.depth) || 0
  }));
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!prefersReduced){
    window.addEventListener('mousemove', (e) => {
      const r = gRoot.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      layers.forEach(({ el, depth }) => {
        const k = (depth - 0.4) * 70;
        el.style.transform = `translate3d(${-x * k}px, ${-y * k * 0.55}px, 0)`;
      });
    });
  }

  // ---- Volume bars ----
  function renderVolumeBars(){
    volumeBars.innerHTML = '';
    for(let i = 0; i < 10; i++){
      const b = document.createElement('button');
      b.type = 'button';
      b.style.height = (7 + i * 1.2) + 'px';
      if(i < Math.round(volume / 10)) b.classList.add('on');
      b.addEventListener('click', () => {
        volume = (i + 1) * 10;
        if(player && player.setVolume) player.setVolume(volume);
        renderVolumeBars();
      });
      volumeBars.appendChild(b);
    }
  }
  renderVolumeBars();

  // ---- Playlists (localStorage) ----
  function loadPlaylists(){
    try{
      const raw = localStorage.getItem(PLAYLISTS_STORAGE);
      if(raw){ playlists = JSON.parse(raw); }
    }catch(e){ playlists = []; }
  }
  function savePlaylists(){
    try{ localStorage.setItem(PLAYLISTS_STORAGE, JSON.stringify(playlists)); }
    catch(e){ console.error('save failed', e); }
  }

  addPlaylistToggle.addEventListener('click', () => {
    addPlaylistForm.classList.toggle('open');
    if(addPlaylistForm.classList.contains('open')) playlistLinkInput.focus();
  });

  addPlaylistBtn.addEventListener('click', async () => {
    const link = playlistLinkInput.value.trim();
    if(!link){ return; }
    const id = extractPlaylistId(link);
    if(!id){
      addStatus.textContent = "That doesn't look like a playlist link or ID.";
      addStatus.classList.add('error');
      return;
    }
    if(playlists.some(p => p.id === id)){
      addStatus.textContent = "Already added.";
      addStatus.classList.add('error');
      return;
    }
    addStatus.classList.remove('error');
    const name = playlistNameInput.value.trim() || ('Playlist ' + (playlists.length + 1));
    playlists.push({ name, id });
    savePlaylists();
    activePlaylistIndex = playlists.length - 1;
    renderNav();
    playlistNameInput.value = '';
    playlistLinkInput.value = '';
    addStatus.textContent = `Added "${name}"`;
    addPlaylistForm.classList.remove('open');
    loadActivePlaylist();
  });

  function renderNav(){
    // Remove existing nav items (everything before the add-toggle button)
    Array.from(gNav.querySelectorAll('.g-nav-item')).forEach(el => el.remove());
    playlists.forEach((pl, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'g-nav-item' + (i === activePlaylistIndex ? ' active' : '');
      btn.innerHTML = `<span class="g-nav-dash"></span><span>${escapeHtml(pl.name)}</span><span class="g-nav-remove">&times;</span>`;
      btn.addEventListener('click', (e) => {
        if(e.target.closest('.g-nav-remove')) return;
        activePlaylistIndex = i;
        currentIndex = -1;
        renderNav();
        loadActivePlaylist();
      });
      btn.querySelector('.g-nav-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        playlists.splice(i, 1);
        if(activePlaylistIndex >= playlists.length){ activePlaylistIndex = Math.max(0, playlists.length - 1); }
        savePlaylists();
        renderNav();
        loadActivePlaylist();
      });
      gNav.insertBefore(btn, addPlaylistToggle);
    });
  }

  async function loadActivePlaylist(){
    setPanelExpanded(false);
    if(playlists.length === 0){
      panelName.textContent = 'No playlist yet';
      panelCount.textContent = '';
      trackRowsEl.innerHTML = '<div class="g-empty">Add a playlist to begin.</div>';
      return;
    }
    const pl = playlists[activePlaylistIndex];
    if(!pl) return;
    panelName.textContent = pl.name;
    panelCount.textContent = 'Loading…';
    tracks = [];
    try{
      let pageToken = ''; let all = [];
      do {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${pl.id}&pageToken=${pageToken}&key=${apiKey}`);
        if(!res.ok) throw new Error('YouTube API error: ' + res.status);
        const data = await res.json();
        all = all.concat(data.items || []);
        pageToken = data.nextPageToken || '';
      } while(pageToken);

      tracks = all
        .filter(item => item.snippet && item.snippet.resourceId && item.snippet.resourceId.videoId && item.snippet.title !== 'Private video' && item.snippet.title !== 'Deleted video')
        .map(item => ({
          id: item.snippet.resourceId.videoId,
          title: item.snippet.title,
          channel: item.snippet.videoOwnerChannelTitle || item.snippet.channelTitle || 'YouTube'
        }));

      panelCount.textContent = tracks.length + (tracks.length === 1 ? ' track' : ' tracks');
      renderTrackList();
    }catch(e){
      panelCount.textContent = 'Error';
      trackRowsEl.innerHTML = '<div class="g-empty">Could not load this playlist. Check the API key and that it is public/unlisted.</div>';
    }
  }

  let panelExpanded = false;
  const panelBody = $id('panelBody');
  function setPanelExpanded(expanded){
    panelExpanded = expanded;
    panelBody.classList.toggle('expanded', expanded);
  }
  panelToggle.addEventListener('click', () => setPanelExpanded(!panelExpanded));
  recordStack.addEventListener('click', () => setPanelExpanded(!panelExpanded));
  showTracksBtn.addEventListener('click', (e) => { e.stopPropagation(); setPanelExpanded(true); });
  hideTracksBtn.addEventListener('click', (e) => { e.stopPropagation(); setPanelExpanded(false); });

  function renderTrackList(){
    trackRowsEl.innerHTML = '';
    if(tracks.length === 0){
      trackRowsEl.innerHTML = '<div class="g-empty">This playlist is empty right now.</div>';
      return;
    }
    tracks.forEach((track, i) => {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'g-track' + (i === currentIndex ? ' active' : '');
      row.innerHTML = `
        <span style="display:flex; flex-direction:column; gap:2px; min-width:0;">
          <span class="g-track-title">${escapeHtml(track.title)}</span>
          <span class="g-track-artist">${escapeHtml(track.channel)}</span>
        </span>
        <span class="g-track-eq"><i></i><i></i><i></i></span>
        <span class="g-track-len">${i === currentIndex ? '' : ''}</span>
      `;
      row.addEventListener('click', () => playTrack(i));
      trackRowsEl.appendChild(row);
    });
    const activeRow = trackRowsEl.querySelector('.g-track.active');
    if(activeRow){
      activeRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  // ---- YouTube IFrame Player ----
  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player('ytPlayer', {
      height: '1', width: '1', videoId: '',
      playerVars: { 'playsinline': 1, 'controls': 0 },
      events: {
        'onReady': () => { playerReady = true; if(player.setVolume) player.setVolume(volume); },
        'onStateChange': onPlayerStateChange
      }
    });
  };
  const ytTag = document.createElement('script');
  ytTag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(ytTag);

  function onPlayerStateChange(event){
    if(event.data === YT.PlayerState.ENDED){
      if(repeatMode === 'one'){ playTrack(currentIndex); }
      else { goNext(); }
    }
    if(event.data === YT.PlayerState.PLAYING){ setPlayingState(true); }
    if(event.data === YT.PlayerState.PAUSED){ setPlayingState(false); }
  }

  function setPlayingState(playing){
    isPlaying = playing;
    document.body.classList.toggle('is-playing', playing);
    playPauseBtn.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
    statusLabel.textContent = playing ? 'Now playing' : 'Paused';
    if(window.mausiqi3D) window.mausiqi3D.setPlaying(playing);
  }

  function playTrack(i){
    if(i < 0 || i >= tracks.length) return;
    currentIndex = i;
    const track = tracks[i];
    nowTitle.textContent = track.title;
    renderTrackList();
    if(playerReady && player && player.loadVideoById){
      player.loadVideoById(track.id);
    } else {
      const check = setInterval(() => {
        if(playerReady && player && player.loadVideoById){ player.loadVideoById(track.id); clearInterval(check); }
      }, 200);
    }
  }

  function pickNextIndex(direction){
    if(tracks.length === 0) return -1;
    if(shuffleOn){
      if(tracks.length === 1) return 0;
      let next;
      do { next = Math.floor(Math.random() * tracks.length); } while(next === currentIndex);
      return next;
    }
    let next = currentIndex + direction;
    if(next >= tracks.length){ return repeatMode === 'all' ? 0 : -1; }
    if(next < 0){ return repeatMode === 'all' ? tracks.length - 1 : -1; }
    return next;
  }
  function goNext(){
    const next = pickNextIndex(1);
    if(next === -1){ player && player.pauseVideo && player.pauseVideo(); return; }
    playTrack(next);
  }
  function goPrev(){
    const prev = pickNextIndex(-1);
    if(prev === -1) return;
    playTrack(prev);
  }

  shuffleBtn.addEventListener('click', () => {
    shuffleOn = !shuffleOn;
    shuffleBtn.classList.toggle('on', shuffleOn);
  });
  repeatBtn.addEventListener('click', () => {
    repeatMode = repeatMode === 'off' ? 'all' : (repeatMode === 'all' ? 'one' : 'off');
    repeatBtn.classList.toggle('on', repeatMode !== 'off');
    $id('repeatBadge').classList.toggle('visible', repeatMode === 'one');
  });

  playPauseBtn.addEventListener('click', () => {
    if(!player) return;
    if(currentIndex === -1 && tracks.length > 0){ playTrack(0); return; }
    if(isPlaying){ player.pauseVideo(); } else { player.playVideo(); }
  });
  nextBtn.addEventListener('click', goNext);
  prevBtn.addEventListener('click', goPrev);

  progressTrack.addEventListener('click', (e) => {
    if(!player || !player.getDuration) return;
    const rect = progressTrack.getBoundingClientRect();
    const clickRatioRaw = (e.clientX - rect.left) / rect.width;
    const viewBoxX = clickRatioRaw * NEEDLE_VIEW_W;
    const ratio = Math.max(0, Math.min(1, (viewBoxX - NEEDLE_START) / (NEEDLE_END - NEEDLE_START)));
    const dur = player.getDuration();
    if(dur > 0){ player.seekTo(dur * ratio, true); setNeedleProgress(ratio); }
  });

  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement.tagName;
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    if(e.code === 'Space'){ e.preventDefault(); playPauseBtn.click(); }
    else if(e.code === 'ArrowRight'){ goNext(); }
    else if(e.code === 'ArrowLeft'){ goPrev(); }
  });

  const NEEDLE_VIEW_W = isMobileLayout ? 328 : 460;
  const NEEDLE_START = 16, NEEDLE_END = isMobileLayout ? 310 : 442;
  function setNeedleProgress(ratio){
    ratio = Math.max(0, Math.min(1, ratio));
    needleClipRect.setAttribute('width', (ratio * NEEDLE_VIEW_W).toFixed(1));
    progressBead.setAttribute('cx', (NEEDLE_START + ratio * (NEEDLE_END - NEEDLE_START)).toFixed(1));
  }

  setInterval(() => {
    if(!player || !player.getCurrentTime || currentIndex === -1) return;
    try{
      const cur = player.getCurrentTime();
      const dur = player.getDuration();
      if(dur > 0){
        setNeedleProgress(cur / dur);
        elapsedTime.textContent = fmtTime(cur) + ' / ' + fmtTime(dur);
      }
    }catch(e){}
  }, 500);

  loadPlaylists();
  renderNav();
  loadActivePlaylist();
})();
</script>

</body>
</html>
