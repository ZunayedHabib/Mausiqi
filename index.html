<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mausiqi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #12131F; --panel: #1B1D30; --brass: #C9A227; --maroon: #8B2635;
    --parchment: #F5E6C8; --dusk: #4A5A6A; --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--night);
    color: var(--parchment); font-family:'Work Sans', sans-serif; min-height:100vh; overflow-x:hidden; padding-bottom:16px; }
  .hero{ position:relative; height:min(34vh, 300px); min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    background: radial-gradient(ellipse at 50% 30%, rgba(139,38,53,0.25), transparent 60%), linear-gradient(180deg, #0B0C16 0%, var(--night) 70%, var(--panel) 100%);
    overflow:hidden; padding-bottom:14px; }
  .stars{ position:absolute; inset:0;
    background-image: radial-gradient(1.5px 1.5px at 20px 30px, rgba(245,230,200,0.5), transparent), radial-gradient(1.5px 1.5px at 120px 80px, rgba(245,230,200,0.35), transparent), radial-gradient(1px 1px at 200px 40px, rgba(245,230,200,0.4), transparent), radial-gradient(1.5px 1.5px at 300px 100px, rgba(245,230,200,0.3), transparent), radial-gradient(1px 1px at 340px 20px, rgba(245,230,200,0.5), transparent), radial-gradient(1.5px 1.5px at 80px 140px, rgba(245,230,200,0.25), transparent), radial-gradient(1px 1px at 250px 150px, rgba(245,230,200,0.35), transparent), radial-gradient(1.5px 1.5px at 160px 20px, rgba(245,230,200,0.3), transparent);
    background-repeat: repeat; background-size: 380px 180px; opacity:0.9; }
  .moon{ position:absolute; left:50%; top:34px; width:52px; height:52px; transform:translateX(-50%) rotate(-22deg);
    filter: drop-shadow(0 0 14px rgba(245,230,200,0.4)); }
  .moon-glow{ position:absolute; left:50%; top:38px; width:120px; height:120px; transform:translate(-50%,-32%);
    background: radial-gradient(circle, rgba(245,230,200,0.45) 0%, rgba(201,162,39,0.15) 45%, transparent 72%); border-radius:50%; filter: blur(4px); animation: glowPulse 4s ease-in-out infinite; pointer-events:none; }
  body.is-playing .moon-glow{ animation: glowPulseActive 1.6s ease-in-out infinite; }
  @keyframes glowPulse{ 0%,100%{ opacity:0.6; transform:translate(-50%,-32%) scale(0.94);} 50%{ opacity:0.85; transform:translate(-50%,-32%) scale(1.06);} }
  @keyframes glowPulseActive{ 0%,100%{ opacity:0.7; transform:translate(-50%,-32%) scale(1);} 50%{ opacity:1; transform:translate(-50%,-32%) scale(1.16);} }
  .dust-motes span{ position:absolute; bottom:20px; width:3px; height:3px; border-radius:50%; background: rgba(245,230,200,0.7); animation: floatUp linear infinite; }
  @keyframes floatUp{ 0%{ transform:translateY(0) translateX(0); opacity:0;} 12%{ opacity:0.7;} 90%{ opacity:0.3;} 100%{ transform:translateY(-260px) translateX(14px); opacity:0;} }

  .hero-clock{ position:absolute; top:16px; right:18px; font-family:'JetBrains Mono', monospace; font-size:0.72rem; letter-spacing:0.05em; color: rgba(245,230,200,0.75); background: rgba(18,19,31,0.35); border:1px solid rgba(245,230,200,0.18); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding:5px 10px; border-radius:20px; z-index:3; }

  .title{ font-family:'Amiri', serif; font-size:2.1rem; letter-spacing:0.04em; margin:8px 0 0 0; color: var(--parchment); text-shadow: 0 0 18px rgba(201,162,39,0.35); z-index:2; }
  .title-persian{ font-family:'Amiri', serif; font-size:1.15rem; color: var(--brass); opacity:0.85; margin:-3px 0 0 0; z-index:2; direction:rtl; }
  .tagline{ font-family:'Amiri', serif; font-style:italic; font-size:0.95rem; color: var(--brass); opacity:0.85; margin:2px 0 0 0; z-index:2; }
  .tagline .attribution{ font-family:'Work Sans', sans-serif; font-style:normal; font-size:0.72rem; opacity:0.7; margin-left:6px; }

  .panel-section{ max-width:640px; margin: 0 auto; padding: 18px 20px 0 20px; position:relative; z-index:3; }

  .glass-card{ background: rgba(27,29,48,0.6); border:1px solid rgba(245,230,200,0.14); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,0.35); }

  .trivia-card{ padding:14px 16px; margin-bottom:16px; }
  .trivia-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .trivia-label{ font-family:'JetBrains Mono', monospace; font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; color: var(--brass); opacity:0.8; }
  .trivia-next{ background:none; border:none; color: var(--brass); cursor:pointer; font-size:0.95rem; padding:2px 6px; opacity:0.8; }
  .trivia-next:hover{ opacity:1; }
  .trivia-text{ font-size:0.82rem; line-height:1.4; min-height:2.2em; opacity:0; transition: opacity 0.35s ease; }
  .trivia-text.visible{ opacity:1; }

  .add-card{ background: var(--panel); border:1px solid rgba(201,162,39,0.25); border-radius: var(--radius); padding:14px; display:flex; gap:8px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); flex-wrap:wrap; }
  .add-card input{ background: rgba(0,0,0,0.25); border:1px solid rgba(245,230,200,0.15); border-radius:10px; padding:11px 14px; color: var(--parchment); font-family:'Work Sans', sans-serif; font-size:0.92rem; outline:none; }
  .add-card input::placeholder{ color: rgba(245,230,200,0.4); }
  .add-card input:focus{ border-color: var(--brass); }
  .add-card .name-input{ width:130px; flex-shrink:0; }
  .add-card .link-input{ flex:1; min-width:180px; }
  .add-card button{ background: var(--brass); color:#1B1D30; border:none; border-radius:10px; padding:0 18px; font-weight:600; font-size:0.9rem; cursor:pointer; }
  .add-card button:hover{ background:#E0B93A; }

  #addStatus{ max-width:640px; margin:8px auto 0 auto; padding: 0 20px; font-size:0.8rem; color: rgba(245,230,200,0.6); min-height:1em; }
  #addStatus.error{ color:#E08A8A; }

  .tabs{ max-width:640px; margin: 18px auto 0 auto; padding: 0 20px; display:flex; gap:8px; flex-wrap:wrap; }
  .tab{ background: rgba(27,29,48,0.55); border:1px solid rgba(245,230,200,0.16); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: rgba(245,230,200,0.7); padding:8px 14px 8px 16px; border-radius:20px; font-size:0.85rem; cursor:pointer; font-family:'Work Sans', sans-serif; display:flex; align-items:center; gap:8px; }
  .tab.active{ background: var(--brass); color:#1B1D30; font-weight:600; border-color: var(--brass); }
  .tab .tab-remove{ background:none; border:none; color:inherit; opacity:0.6; cursor:pointer; font-size:0.9rem; padding:0; line-height:1; }
  .tab .tab-remove:hover{ opacity:1; }

  .status-line{ max-width:640px; margin:10px auto 0 auto; padding: 0 20px; font-size:0.8rem; color: rgba(245,230,200,0.6); min-height:1em; display:flex; align-items:center; justify-content:space-between; }
  .status-line.error{ color:#E08A8A; }
  .refresh-btn{ background:none; border:1px solid rgba(201,162,39,0.35); color: var(--brass); border-radius:8px; padding:4px 12px; font-size:0.78rem; cursor:pointer; }
  .refresh-btn:hover{ background: rgba(201,162,39,0.12); }

  .now-playing-card{ max-width:640px; margin:18px auto 0 auto; padding:14px 16px; display:none; align-items:center; gap:14px; }
  .now-playing-card.visible{ display:flex; }
  .np-art{ width:64px; height:64px; border-radius:10px; overflow:hidden; flex-shrink:0; background:#000; position:relative; }
  .np-art img{ width:100%; height:100%; object-fit:cover; display:block; }
  .np-info{ flex:1; min-width:0; }
  .np-title{ font-size:0.95rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np-channel{ font-size:0.75rem; color: rgba(245,230,200,0.55); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .np-progress{ height:4px; background: rgba(245,230,200,0.15); border-radius:2px; margin-top:8px; overflow:hidden; cursor:pointer; }
  .np-progress-fill{ height:100%; width:0%; background: var(--brass); border-radius:2px; transition: width 0.2s linear; }
  .np-times{ display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:0.65rem; color: rgba(245,230,200,0.5); margin-top:4px; }
  .np-controls{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .np-controls button{ background: rgba(245,230,200,0.08); border:none; color: var(--parchment); width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:0.9rem; display:flex; align-items:center; justify-content:center; }
  .np-controls button:hover{ background: rgba(201,162,39,0.25); }
  .np-controls .play-pause{ background: var(--brass); color:#1B1D30; width:40px; height:40px; font-size:1rem; }
  .np-controls .play-pause:hover{ background:#E0B93A; }
  .np-controls .queue-toggle{ background: rgba(245,230,200,0.08); }
  .np-controls .queue-toggle.open{ background: rgba(201,162,39,0.3); color: var(--brass); }
  .np-controls .active-toggle{ background: rgba(201,162,39,0.3); color: var(--brass); }

  .np-volume-row{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .np-vol-icon{ font-size:0.75rem; opacity:0.7; }
  .np-volume-row input[type="range"]{ flex:1; max-width:120px; height:4px; -webkit-appearance:none; appearance:none; background: rgba(245,230,200,0.15); border-radius:2px; outline:none; }
  .np-volume-row input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:12px; height:12px; border-radius:50%; background: var(--brass); cursor:pointer; }
  .np-volume-row input[type="range"]::-moz-range-thumb{ width:12px; height:12px; border-radius:50%; background: var(--brass); border:none; cursor:pointer; }

  .playlist{ max-width:640px; margin: 10px auto 0 auto; padding: 0 20px; display:flex; flex-direction:column; gap:8px; }
  .playlist.collapsed{ display:none; }
  .playlist.visible{ display:flex; }
  .empty-state{ text-align:center; color: rgba(245,230,200,0.45); font-family:'Amiri', serif; font-style:italic; padding: 30px 10px; border:1px dashed rgba(245,230,200,0.15); border-radius: var(--radius); }
  .track{ display:flex; align-items:center; gap:12px; background: var(--panel); border:1px solid transparent; border-radius:10px; padding:8px 10px; cursor:pointer; transition: border-color 0.15s ease, background 0.15s ease; }
  .track:hover{ border-color: rgba(201,162,39,0.25); }
  .track.active{ border-color: var(--brass); background: linear-gradient(90deg, rgba(201,162,39,0.14), var(--panel) 55%); }
  .track img{ width:56px; height:40px; object-fit:cover; border-radius:6px; flex-shrink:0; }
  .track .num{ font-family:'JetBrains Mono', monospace; font-size:0.72rem; color: var(--dusk); width:18px; text-align:center; flex-shrink:0; }
  .track.active .num{ color: var(--brass); }
  .track .name{ flex:1; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #ytPlayerHidden{ position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; pointer-events:none; }

  .bottom-photo{ position:relative; height:min(30vh, 260px); min-height:180px; margin-top:28px; overflow:hidden; }

<body>
<div class="grain-overlay"></div>

<section class="hero">
  <div class="stars"></div>
  <svg class="moon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="moonGrad" cx="35%" cy="35%" r="75%">
        <stop offset="0%" stop-color="#FBF6E8"/>
        <stop offset="60%" stop-color="#F0E6C8"/>
        <stop offset="100%" stop-color="#E4D6AE"/>
      </radialGradient>
      <mask id="moonMask">
        <rect x="0" y="0" width="100" height="100" fill="black"/>
        <circle cx="50" cy="50" r="40" fill="white"/>
        <circle cx="66" cy="36" r="34" fill="black"/>
      </mask>
    </defs>
    <rect x="0" y="0" width="100" height="100" fill="url(#moonGrad)" mask="url(#moonMask)"/>
  </svg>
  <div class="moon-glow"></div>
  <div class="hero-clock" id="heroClock">12:00 PM</div>
  <div class="dust-motes">
    <span style="left:22%; animation-duration:9s; animation-delay:0s;"></span>
    <span style="left:38%; animation-duration:11s; animation-delay:2s;"></span>
    <span style="left:55%; animation-duration:8s; animation-delay:1s;"></span>
    <span style="left:68%; animation-duration:12s; animation-delay:3.5s;"></span>
    <span style="left:80%; animation-duration:10s; animation-delay:0.8s;"></span>
    <span style="left:47%; animation-duration:13s; animation-delay:4.5s;"></span>
  </div>
  <h1 class="title">Mausiqi</h1>
  <p class="title-persian">موسیقی</p>
  <p class="tagline">"Music expresses that which cannot be put into words."<span class="attribution">— Victor Hugo</span></p>
</section>

<div class="panel-section">
  <div class="glass-card trivia-card">
    <div class="trivia-head">
      <span class="trivia-label">Mehfil notes</span>
      <button class="trivia-next" id="triviaNext" aria-label="Next fact">→</button>
    </div>
    <div class="trivia-text" id="triviaText"></div>
  </div>

  <div class="add-card">
    <input id="playlistNameInput" class="name-input" type="text" placeholder="Label (optional)">
    <input id="playlistLinkInput" class="link-input" type="text" placeholder="Paste a YouTube playlist link or ID…">
    <button id="addPlaylistBtn">Add playlist</button>
  </div>
</div>
<div id="addStatus"></div>

<div class="tabs" id="tabs"></div>
<div class="status-line" id="statusLine">
  <span id="statusText">No playlists added yet.</span>
  <button class="refresh-btn" id="refreshBtn">Refresh</button>
</div>

<div class="glass-card now-playing-card" id="nowPlayingCard">
  <div class="np-art" id="npArt"><img id="npArtImg" src="" alt=""></div>
  <div class="np-info">
    <div class="np-title" id="npTitle">—</div>
    <div class="np-channel" id="npChannel">—</div>
    <div class="np-progress" id="npProgressTrack"><div class="np-progress-fill" id="npProgressFill"></div></div>
    <div class="np-times"><span id="npElapsed">0:00</span><span id="npDuration">0:00</span></div>
    <div class="np-volume-row">
      <span class="np-vol-icon">🔊</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="100">
    </div>
  </div>
  <div class="np-controls">
    <button id="shuffleBtn" aria-label="Shuffle">🔀</button>
    <button id="prevBtn" aria-label="Previous">⏮</button>
    <button id="playPauseBtn" class="play-pause" aria-label="Play or pause">▶</button>
    <button id="nextBtn" aria-label="Next">⏭</button>
    <button id="repeatBtn" aria-label="Repeat">🔁</button>
    <button id="queueToggleBtn" class="queue-toggle open" aria-label="Toggle queue">☰</button>
  </div>
</div>

<div class="playlist" id="playlist"></div>

<div id="ytPlayerHidden"><div id="ytPlayer"></div></div>

<section class="bottom-photo">
  <div class="bottom-photo-img"></div>
  <div class="bottom-photo-scrim"></div>
</section>

<footer class="site-footer">
  <div class="footer-divider"></div>
  <p class="footer-line">موسیقی</p>
  <p class="footer-sub">a mehfil of your own choosing</p>
</footer>

<script>
(function(){
  // ---- SITE OWNER: set this once before deploying ----
  // Get a free key from console.cloud.google.com -> enable "YouTube Data API v3" -> Credentials.
  // Then in the key's settings, restrict it to "HTTP referrers" and add your deployed domain
  // (e.g. mausiqi.vercel.app/*) so it can't be used anywhere else. Visitors never see this.
  const SITE_API_KEY = "AIzaSyC7eCXVmSldjiW34uNZ0QlpO_zF1J9lx-k";
  // -----------------------------------------------------

  const PLAYLISTS_STORAGE = 'mausiqi-playlists';

  const TRIVIA = [
    "Qawwali is credited to the 13th-century Sufi poet-musician Amir Khusrau, who fused Persian, Arabic, Turkic, and Indian traditions into one devotional form.",
    "The word \"qawwali\" comes from qawwal — the singer who voices a Sufi saint's verses to an assembled audience.",
    "Some accounts credit Amir Khusrau with introducing the tabla and sitar to Indian music, alongside qawwali itself, though this is debated by historians.",
    "A qawwali gathering is traditionally called a mehfil-e-sama — an assembly for listening — where music becomes a path to shared devotion.",
    "Delhi's Qawwal Bachche lineage traces an unbroken teaching line back roughly 800 years to Amir Khusrau's original student, Saamat Bin Ibrahim.",
    "The gramophone was patented by Emile Berliner in 1887, replacing Edison's wax cylinder with a flat, mass-producible disc.",
    "Nusrat Fateh Ali Khan carried qawwali from Sufi shrines to concert stages worldwide in the twentieth century, introducing it to entirely new audiences.",
    "The harmonium began as a European reed organ; it was reshaped with a hand-pumped bellows after arriving in South Asia, becoming central to devotional music."
  ];
  let triviaIndex = 0;

  const heroClock = document.getElementById('heroClock');
  function updateClock(){
    const now = new Date();
    let h = now.getHours();
    const m = String(now.getMinutes()).padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    heroClock.textContent = h + ':' + m + ' ' + ampm;
  }
  updateClock();
  setInterval(updateClock, 15000);

  const triviaText = document.getElementById('triviaText');
  const triviaNext = document.getElementById('triviaNext');
  function showTrivia(i){
    triviaText.classList.remove('visible');
    setTimeout(() => {
      triviaText.textContent = TRIVIA[i];
      triviaText.classList.add('visible');
    }, 200);
  }
  showTrivia(triviaIndex);
  triviaNext.addEventListener('click', () => {
    triviaIndex = (triviaIndex + 1) % TRIVIA.length;
    showTrivia(triviaIndex);
  });
  setInterval(() => {
    triviaIndex = (triviaIndex + 1) % TRIVIA.length;
    showTrivia(triviaIndex);
  }, 9000);

  let apiKey = SITE_API_KEY;
  let playlists = [];
  let activePlaylistIndex = 0;
  let tracks = [];
  let currentIndex = -1;
  let player = null;
  let playerReady = false;
  let isPlaying = false;
  let queueOpen = true;
  let shuffleOn = false;
  let repeatMode = 'off'; // 'off' | 'all' | 'one'

  const playlistNameInput = document.getElementById('playlistNameInput');
  const playlistLinkInput = document.getElementById('playlistLinkInput');
  const addPlaylistBtn = document.getElementById('addPlaylistBtn');
  const addStatus = document.getElementById('addStatus');
  const tabsEl = document.getElementById('tabs');
  const playlistEl = document.getElementById('playlist');
  const statusText = document.getElementById('statusText');
  const statusLine = document.getElementById('statusLine');
  const refreshBtn = document.getElementById('refreshBtn');
  const nowPlayingCard = document.getElementById('nowPlayingCard');
  const npArtImg = document.getElementById('npArtImg');
  const npTitle = document.getElementById('npTitle');
  const npChannel = document.getElementById('npChannel');
  const npProgressFill = document.getElementById('npProgressFill');
  const npProgressTrack = document.getElementById('npProgressTrack');
  const npElapsed = document.getElementById('npElapsed');
  const npDuration = document.getElementById('npDuration');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const queueToggleBtn = document.getElementById('queueToggleBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const repeatBtn = document.getElementById('repeatBtn');
  const volumeSlider = document.getElementById('volumeSlider');

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2,'0');
    return m + ':' + s;
  }
  function extractPlaylistId(input){
    input = input.trim();
    const m = input.match(/[?&]list=([A-Za-z0-9_-]+)/);
    if(m) return m[1];
    if(/^[A-Za-z0-9_-]{10,}$/.test(input)) return input;
    return null;
  }

  function loadPlaylists(){
    try{
      const raw = localStorage.getItem(PLAYLISTS_STORAGE);
      if(raw){ playlists = JSON.parse(raw); }
    }catch(e){ playlists = []; }
  }
  function savePlaylists(){
    try{ localStorage.setItem(PLAYLISTS_STORAGE, JSON.stringify(playlists)); }
    catch(e){ console.error('save failed', e); }
  }

  addPlaylistBtn.addEventListener('click', async () => {
    const link = playlistLinkInput.value.trim();
    if(!link){ return; }
    const id = extractPlaylistId(link);
    if(!id){ addStatus.textContent = "That doesn't look like a playlist link or ID."; addStatus.classList.add('error'); return; }
    if(playlists.some(p => p.id === id)){ addStatus.textContent = "That playlist is already added."; addStatus.classList.add('error'); return; }
    addStatus.classList.remove('error');
    const name = playlistNameInput.value.trim() || ('Playlist ' + (playlists.length + 1));
    playlists.push({ name, id });
    await savePlaylists();
    activePlaylistIndex = playlists.length - 1;
    renderTabs();
    playlistNameInput.value = '';
    playlistLinkInput.value = '';
    addStatus.textContent = `Added "${name}"`;
    loadActivePlaylist();
  });

  function renderTabs(){
    tabsEl.innerHTML = '';
    playlists.forEach((pl, i) => {
      const tab = document.createElement('div');
      tab.className = 'tab' + (i === activePlaylistIndex ? ' active' : '');
      tab.innerHTML = `<span>${escapeHtml(pl.name)}</span><button class="tab-remove" aria-label="Remove playlist">✕</button>`;
      tab.querySelector('span').addEventListener('click', () => {
        activePlaylistIndex = i; currentIndex = -1; renderTabs(); loadActivePlaylist();
      });
      tab.querySelector('.tab-remove').addEventListener('click', async (e) => {
        e.stopPropagation();
        playlists.splice(i, 1);
        if(activePlaylistIndex >= playlists.length){ activePlaylistIndex = Math.max(0, playlists.length - 1); }
        await savePlaylists(); renderTabs(); loadActivePlaylist();
      });
      tabsEl.appendChild(tab);
    });
  }

  async function loadActivePlaylist(){
    if(playlists.length === 0){
      statusText.textContent = 'No playlists added yet.';
      playlistEl.innerHTML = '<div class="empty-state">Paste a YouTube playlist link above to begin your mehfil.</div>';
      return;
    }
    if(!apiKey){
      statusText.textContent = 'Add your API key above to load playlists.';
      statusLine.classList.add('error');
      playlistEl.innerHTML = '<div class="empty-state">Waiting for an API key…</div>';
      return;
    }
    const pl = playlists[activePlaylistIndex];
    if(!pl) return;
    statusLine.classList.remove('error');
    statusText.textContent = 'Loading "' + pl.name + '"…';
    tracks = [];
    try{
      let pageToken = ''; let all = [];
      do {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${pl.id}&pageToken=${pageToken}&key=${apiKey}`);
        if(!res.ok) throw new Error('YouTube API error: ' + res.status);
        const data = await res.json();
        all = all.concat(data.items || []);
        pageToken = data.nextPageToken || '';
      } while(pageToken);

      tracks = all
        .filter(item => item.snippet && item.snippet.resourceId && item.snippet.resourceId.videoId && item.snippet.title !== 'Private video' && item.snippet.title !== 'Deleted video')
        .map(item => ({
          id: item.snippet.resourceId.videoId,
          title: item.snippet.title,
          channel: item.snippet.videoOwnerChannelTitle || item.snippet.channelTitle || 'YouTube',
          thumb: (item.snippet.thumbnails && (item.snippet.thumbnails.medium || item.snippet.thumbnails.default)) ? (item.snippet.thumbnails.medium || item.snippet.thumbnails.default).url : ''
        }));

      statusText.textContent = tracks.length + ' track' + (tracks.length === 1 ? '' : 's') + ' in "' + pl.name + '"';
      renderPlaylist();
    }catch(e){
      statusLine.classList.add('error');
      statusText.textContent = 'Could not load this playlist. Check the API key and that the playlist is public/unlisted.';
      playlistEl.innerHTML = '<div class="empty-state">Something went wrong loading this playlist.</div>';
    }
  }

  function renderPlaylist(){
    playlistEl.innerHTML = '';
    if(tracks.length === 0){ playlistEl.innerHTML = '<div class="empty-state">This playlist is empty right now.</div>'; return; }
    tracks.forEach((track, i) => {
      const row = document.createElement('div');
      row.className = 'track' + (i === currentIndex ? ' active' : '');
      row.innerHTML = `
        <span class="num">${String(i+1).padStart(2,'0')}</span>
        <img src="${track.thumb}" alt="">
        <span class="name">${escapeHtml(track.title)}</span>
      `;
      row.addEventListener('click', () => playTrack(i));
      playlistEl.appendChild(row);
    });
  }

  refreshBtn.addEventListener('click', loadActivePlaylist);

  queueToggleBtn.addEventListener('click', () => {
    queueOpen = !queueOpen;
    playlistEl.classList.toggle('collapsed', !queueOpen);
    queueToggleBtn.classList.toggle('open', queueOpen);
  });

  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player('ytPlayer', {
      height: '1', width: '1', videoId: '',
      playerVars: { 'playsinline': 1, 'controls': 0 },
      events: { 'onReady': () => { playerReady = true; }, 'onStateChange': onPlayerStateChange }
    });
  };
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  function onPlayerStateChange(event){
    if(event.data === YT.PlayerState.ENDED){
      if(repeatMode === 'one'){ playTrack(currentIndex); }
      else { goNext(); }
    }
    if(event.data === YT.PlayerState.PLAYING){ setPlayingState(true); }
    if(event.data === YT.PlayerState.PAUSED){ setPlayingState(false); }
  }

  function setPlayingState(playing){
    isPlaying = playing;
    document.body.classList.toggle('is-playing', playing);
    playPauseBtn.textContent = playing ? '⏸' : '▶';
  }

  function playTrack(i){
    if(i < 0 || i >= tracks.length) return;
    currentIndex = i;
    const track = tracks[i];
    npTitle.textContent = track.title;
    npChannel.textContent = track.channel;
    npArtImg.src = track.thumb;
    nowPlayingCard.classList.add('visible');
    renderPlaylist();
    if(playerReady && player && player.loadVideoById){
      player.loadVideoById(track.id);
    } else {
      const check = setInterval(() => {
        if(playerReady && player && player.loadVideoById){ player.loadVideoById(track.id); clearInterval(check); }
      }, 200);
    }
  }

  function pickNextIndex(direction){
    if(tracks.length === 0) return -1;
    if(shuffleOn){
      if(tracks.length === 1) return 0;
      let next;
      do { next = Math.floor(Math.random() * tracks.length); } while(next === currentIndex);
      return next;
    }
    let next = currentIndex + direction;
    if(next >= tracks.length){ return repeatMode === 'all' ? 0 : -1; }
    if(next < 0){ return repeatMode === 'all' ? tracks.length - 1 : -1; }
    return next;
  }

  function goNext(){
    const next = pickNextIndex(1);
    if(next === -1){ player && player.pauseVideo && player.pauseVideo(); return; }
    playTrack(next);
  }
  function goPrev(){
    const prev = pickNextIndex(-1);
    if(prev === -1) return;
    playTrack(prev);
  }

  shuffleBtn.addEventListener('click', () => {
    shuffleOn = !shuffleOn;
    shuffleBtn.classList.toggle('active-toggle', shuffleOn);
  });

  const REPEAT_ICONS = { off: '🔁', all: '🔁', one: '🔂' };
  repeatBtn.addEventListener('click', () => {
    repeatMode = repeatMode === 'off' ? 'all' : (repeatMode === 'all' ? 'one' : 'off');
    repeatBtn.textContent = REPEAT_ICONS[repeatMode];
    repeatBtn.classList.toggle('active-toggle', repeatMode !== 'off');
  });

  volumeSlider.addEventListener('input', () => {
    if(player && player.setVolume){ player.setVolume(parseInt(volumeSlider.value, 10)); }
  });

  playPauseBtn.addEventListener('click', () => {
    if(!player) return;
    if(currentIndex === -1 && tracks.length > 0){ playTrack(0); return; }
    if(isPlaying){ player.pauseVideo(); } else { player.playVideo(); }
  });
  nextBtn.addEventListener('click', goNext);
  prevBtn.addEventListener('click', goPrev);

  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement.tagName;
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    if(e.code === 'Space'){ e.preventDefault(); playPauseBtn.click(); }
    else if(e.code === 'ArrowRight'){ goNext(); }
    else if(e.code === 'ArrowLeft'){ goPrev(); }
  });

  npProgressTrack.addEventListener('click', (e) => {
    if(!player || !player.getDuration) return;
    const rect = npProgressTrack.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    const dur = player.getDuration();
    if(dur > 0){ player.seekTo(dur * ratio, true); }
  });

  setInterval(() => {
    if(!player || !player.getCurrentTime || currentIndex === -1) return;
    try{
      const cur = player.getCurrentTime();
      const dur = player.getDuration();
      if(dur > 0){
        npProgressFill.style.width = ((cur / dur) * 100) + '%';
        npElapsed.textContent = fmtTime(cur);
        npDuration.textContent = fmtTime(dur);
      }
    }catch(e){}
  }, 500);

  loadPlaylists();
  renderTabs();
  loadActivePlaylist();
})();
</script>

</body>
</html>
